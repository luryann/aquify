<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#fafaf8"/>
  <rect x="70" y="70" width="1060" height="660" rx="24" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
  <text x="110" y="150" font-size="42" font-family="Georgia, serif" fill="#111111">Tri-City Classic Warm-Up Assignments</text>
  <text x="110" y="200" font-size="22" font-family="sans-serif" fill="#6b6866">Saturday AM / Saturday PM / Sunday AM</text>
  <g font-family="sans-serif" font-size="24">
    <rect x="110" y="250" width="300" height="380" rx="18" fill="#fff4ec" stroke="#eb5d1e"/>
    <text x="140" y="300" fill="#8b3312">Saturday AM</text>
    <text x="140" y="360" fill="#111111">7:00 AM warm-up</text>
    <text x="140" y="410" fill="#111111">Lanes 1-3 Senior Girls</text>
    <text x="140" y="455" fill="#111111">Lanes 4-5 Senior Boys</text>
    <text x="140" y="500" fill="#111111">Lanes 6-8 Junior Group</text>
    <rect x="450" y="250" width="300" height="380" rx="18" fill="#eef6ff" stroke="#3b82f6"/>
    <text x="480" y="300" fill="#1d4ed8">Saturday PM</text>
    <text x="480" y="360" fill="#111111">1:00 PM warm-up</text>
    <text x="480" y="410" fill="#111111">Sprint lane assignments posted</text>
    <text x="480" y="455" fill="#111111">Check in 20 min before parade</text>
    <rect x="790" y="250" width="300" height="380" rx="18" fill="#eefcf4" stroke="#10b981"/>
    <text x="820" y="300" fill="#047857">Sunday AM</text>
    <text x="820" y="360" fill="#111111">7:30 AM warm-up</text>
    <text x="820" y="410" fill="#111111">Positive check-in required</text>
    <text x="820" y="455" fill="#111111">Opening 200 IM events first</text>
  </g>
</svg>
