name: dare-staging

x-restart: &default-restart
  restart: unless-stopped

x-logging: &default-logging
  logging:
    driver: loki
    options:
      loki-url: "http://loki:3100/loki/api/v1/push"
      loki-pipeline-stages: |
        - json:
            expressions:
              level: level
              msg: msg
      max-size: "10m"
      max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------

  dare-api:
    image: ghcr.io/${GHCR_NAMESPACE:?set GHCR_NAMESPACE to the registry owner}/dare-api:${IMAGE_TAG:-latest}
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      API_ADDR: ":8080"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/dare-api", "healthcheck", "http://localhost:8080/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dare-net
    mem_limit: 512m
    cpus: "0.5"
    labels:
      com.dare.service: "api"
      com.dare.env: "staging"
    <<: *default-logging

  dare-admin:
    image: ghcr.io/${GHCR_NAMESPACE:?set GHCR_NAMESPACE to the registry owner}/dare-admin:${IMAGE_TAG:-latest}
    <<: *default-restart
    depends_on:
      dare-api:
        condition: service_healthy
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://dare-api:8080
      NEXT_PUBLIC_APP_ENV: staging
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dare-net
    mem_limit: 256m
    cpus: "0.25"
    labels:
      com.dare.service: "admin"
      com.dare.env: "staging"
    <<: *default-logging

  dare-worker:
    image: ghcr.io/${GHCR_NAMESPACE:?set GHCR_NAMESPACE to the registry owner}/dare-api:${IMAGE_TAG:-latest}
    command: ["worker"]
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
    networks:
      - dare-net
    mem_limit: 256m
    cpus: "0.25"
    labels:
      com.dare.service: "worker"
      com.dare.env: "staging"
    <<: *default-logging

  # ---------------------------------------------------------------------------
  # Data Services
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    <<: *default-restart
    env_file:
      - .env.staging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dare_staging}
      POSTGRES_USER: ${POSTGRES_USER:-dare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=128MB
        -c effective_cache_size=384MB
        -c maintenance_work_mem=32MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=4MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=2621kB
        -c min_wal_size=1GB
        -c max_wal_size=4GB
        -c log_min_duration_statement=500
        -c log_checkpoints=on
        -c log_connections=on
        -c log_lock_waits=on
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dare} -d ${POSTGRES_DB:-dare_staging}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - dare-net
    mem_limit: 512m
    cpus: "0.5"
    labels:
      com.dare.service: "postgres"
      com.dare.env: "staging"

  redis:
    image: redis:7-alpine
    <<: *default-restart
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --appendonly yes
        --appendfsync everysec
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - dare-net
    mem_limit: 192m
    cpus: "0.25"
    labels:
      com.dare.service: "redis"
      com.dare.env: "staging"

  minio:
    image: minio/minio:latest
    <<: *default-restart
    command: server /data --console-address ":9001"
    env_file:
      - .env.staging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: https://minio-staging.dare.club
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_staging_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dare-net
    mem_limit: 512m
    cpus: "0.5"
    labels:
      com.dare.service: "minio"
      com.dare.env: "staging"

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    <<: *default-restart
    command: start --optimized
    env_file:
      - .env.staging
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dare_staging}
      KC_DB_USERNAME: ${POSTGRES_USER:-dare}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: auth-staging.dare.club
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8081"
      KC_PROXY: edge
      KC_REALM_IMPORT: /opt/keycloak/data/import/staging-realm.json
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./keycloak/staging-realm.json:/opt/keycloak/data/import/staging-realm.json:ro
    networks:
      - dare-net
    mem_limit: 512m
    cpus: "0.5"
    labels:
      com.dare.service: "keycloak"
      com.dare.env: "staging"

  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    <<: *default-restart
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./prometheus/prometheus.staging.yml:/etc/prometheus/prometheus.yml:ro
      - ../docs/observability/prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_staging_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - dare-net
    mem_limit: 256m
    cpus: "0.25"
    labels:
      com.dare.service: "prometheus"
      com.dare.env: "staging"

  grafana:
    image: grafana/grafana:latest
    <<: *default-restart
    env_file:
      - .env.staging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana-staging.dare.club
      GF_INSTALL_PLUGINS: grafana-loki-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_staging_data:/var/lib/grafana
      - ../docs/observability/grafana:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources.staging.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - dare-net
    mem_limit: 256m
    cpus: "0.25"
    labels:
      com.dare.service: "grafana"
      com.dare.env: "staging"

  loki:
    image: grafana/loki:latest
    <<: *default-restart
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_staging_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - dare-net
    mem_limit: 256m
    cpus: "0.25"
    labels:
      com.dare.service: "loki"
      com.dare.env: "staging"

  # ---------------------------------------------------------------------------
  # Staging-only: Local mail catcher
  # ---------------------------------------------------------------------------

  mailpit:
    image: axllent/mailpit:latest
    <<: *default-restart
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit_staging_data:/data
    networks:
      - dare-net
    mem_limit: 64m
    cpus: "0.1"
    labels:
      com.dare.service: "mailpit"
      com.dare.env: "staging"

  # ---------------------------------------------------------------------------
  # Staging-only: Internal status/uptime monitoring
  # ---------------------------------------------------------------------------

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    <<: *default-restart
    ports:
      - "127.0.0.1:3002:3001"
    volumes:
      - uptime_kuma_staging_data:/app/data
    networks:
      - dare-net
    mem_limit: 128m
    cpus: "0.1"
    labels:
      com.dare.service: "uptime-kuma"
      com.dare.env: "staging"

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local
  minio_staging_data:
    driver: local
  prometheus_staging_data:
    driver: local
  grafana_staging_data:
    driver: local
  loki_staging_data:
    driver: local
  mailpit_staging_data:
    driver: local
  uptime_kuma_staging_data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------

networks:
  dare-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
