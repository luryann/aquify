name: aquify-staging

x-restart: &default-restart
  restart: unless-stopped

# The Loki driver runs inside the Docker daemon on the HOST, not in the compose network:
# it cannot resolve the service name "loki", so it pushes to the loopback port loki publishes.
x-logging: &default-logging
  logging:
    driver: loki
    options:
      loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
      loki-pipeline-stages: |
        - json:
            expressions:
              level: level
              msg: msg
      max-size: "10m"
      max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------

  aquify-api:
    image: ghcr.io/${GHCR_NAMESPACE:?set GHCR_NAMESPACE to the registry owner}/aquify-api:${IMAGE_TAG:?set IMAGE_TAG (release.env)}
    <<: [*default-restart, *default-logging]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # .env.staging.app: runtime config for api/worker only (same split as production).
    env_file:
      - .env.staging.app
    environment:
      APP_ENV: staging
      API_ADDR: ":8080"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/aquify-api", "healthcheck", "http://localhost:8080/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - aquify-net
    mem_limit: 512m
    cpus: "0.5"
    labels:
      com.aquify.service: "api"
      com.aquify.env: "staging"

  aquify-admin:
    image: ghcr.io/${GHCR_NAMESPACE:?set GHCR_NAMESPACE to the registry owner}/aquify-admin:${IMAGE_TAG:?set IMAGE_TAG (release.env)}
    <<: [*default-restart, *default-logging]
    depends_on:
      aquify-api:
        condition: service_healthy
    # No env_file: the admin server reads only the variables listed here.
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://aquify-api:8080
      NEXT_PUBLIC_APP_ENV: staging
      NEXT_PUBLIC_AUTH_ENABLE_DEV_STUB_TOKENS: "false"
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aquify-net
    mem_limit: 256m
    cpus: "0.25"
    labels:
      com.aquify.service: "admin"
      com.aquify.env: "staging"

  # One-shot schema migration, run by deploy/scripts/promote.sh before the app containers
  # are replaced. Connects as the schema-owning role; api/worker use the restricted role.
  aquify-migrate:
    image: ghcr.io/${GHCR_NAMESPACE:?set GHCR_NAMESPACE to the registry owner}/aquify-api:${IMAGE_TAG:?set IMAGE_TAG (release.env)}
    profiles: ["tools"]
    restart: "no"
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: staging
      MIGRATE_DATABASE_URL: postgres://${AQUIFY_OWNER_DB_USER:-aquify_owner}:${AQUIFY_OWNER_DB_PASSWORD:?set AQUIFY_OWNER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-aquify_staging}?sslmode=disable
    networks:
      - aquify-net
    mem_limit: 256m
    labels:
      com.aquify.service: "migrate"
      com.aquify.env: "staging"

  aquify-worker:
    image: ghcr.io/${GHCR_NAMESPACE:?set GHCR_NAMESPACE to the registry owner}/aquify-api:${IMAGE_TAG:?set IMAGE_TAG (release.env)}
    command: ["worker"]
    <<: [*default-restart, *default-logging]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.staging.app
    environment:
      APP_ENV: staging
    networks:
      - aquify-net
    mem_limit: 256m
    cpus: "0.25"
    labels:
      com.aquify.service: "worker"
      com.aquify.env: "staging"

  # ---------------------------------------------------------------------------
  # Data Services
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    <<: *default-restart
    # POSTGRES_USER is the bootstrap superuser (init script + break-glass only). The init
    # script creates the owner / app (NOBYPASSRLS) / backup / keycloak roles on first start of
    # an EMPTY volume; the API refuses to start as a superuser outside development.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aquify_staging}
      POSTGRES_USER: ${POSTGRES_USER:-aquify_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      AQUIFY_OWNER_DB_USER: ${AQUIFY_OWNER_DB_USER:-aquify_owner}
      AQUIFY_OWNER_DB_PASSWORD: ${AQUIFY_OWNER_DB_PASSWORD:?set AQUIFY_OWNER_DB_PASSWORD}
      AQUIFY_APP_DB_USER: ${AQUIFY_APP_DB_USER:-aquify_app}
      AQUIFY_APP_DB_PASSWORD: ${AQUIFY_APP_DB_PASSWORD:?set AQUIFY_APP_DB_PASSWORD}
      AQUIFY_BACKUP_DB_USER: ${AQUIFY_BACKUP_DB_USER:-aquify_backup}
      AQUIFY_BACKUP_DB_PASSWORD: ${AQUIFY_BACKUP_DB_PASSWORD:?set AQUIFY_BACKUP_DB_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=128MB
        -c effective_cache_size=384MB
        -c maintenance_work_mem=32MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=4MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=2621kB
        -c min_wal_size=1GB
        -c max_wal_size=4GB
        -c log_min_duration_statement=500
        -c log_checkpoints=on
        -c log_connections=on
        -c log_lock_waits=on
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquify_admin} -d ${POSTGRES_DB:-aquify_staging}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - aquify-net
    mem_limit: 512m
    cpus: "0.5"
    labels:
      com.aquify.service: "postgres"
      com.aquify.env: "staging"

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    <<: *default-restart
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --appendonly yes
        --appendfsync everysec
        --maxmemory 256mb
        --maxmemory-policy noeviction
        --save 900 1
        --save 300 10
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - aquify-net
    mem_limit: 384m
    cpus: "0.25"
    labels:
      com.aquify.service: "redis"
      com.aquify.env: "staging"

  minio:
    image: aquify-minio:2026-02-12
    build: ./minio
    <<: *default-restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: https://minio-staging.aquify.club
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_staging_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - aquify-net
    mem_limit: 512m
    cpus: "0.5"
    labels:
      com.aquify.service: "minio"
      com.aquify.env: "staging"

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------

  keycloak:
    image: quay.io/keycloak/keycloak:26.5@sha256:45ae20191531eb608ddb0b775d012b40d3e4f942697f3214694887dd7c108d13
    <<: *default-restart
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://auth-staging.aquify.club
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8081"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Rendered on the host by keycloak/render_realm.py (see deploy/README.md); Keycloak
      # requires the file name <realm>-realm.json.
      - ./keycloak/staging-realm.json:/opt/keycloak/data/import/aquify-realm.json:ro
    networks:
      - aquify-net
    mem_limit: 512m
    cpus: "0.5"
    labels:
      com.aquify.service: "keycloak"
      com.aquify.env: "staging"

  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    <<: *default-restart
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./prometheus/prometheus.staging.yml:/etc/prometheus/prometheus.yml:ro
      - ./docs/observability/prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_staging_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - aquify-net
    mem_limit: 256m
    cpus: "0.25"
    labels:
      com.aquify.service: "prometheus"
      com.aquify.env: "staging"

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    <<: *default-restart
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana-staging.aquify.club
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_staging_data:/var/lib/grafana
      - ./docs/observability/grafana:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources.staging.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - aquify-net
    mem_limit: 256m
    cpus: "0.25"
    labels:
      com.aquify.service: "grafana"
      com.aquify.env: "staging"

  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    <<: *default-restart
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_staging_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - aquify-net
    mem_limit: 256m
    cpus: "0.25"
    labels:
      com.aquify.service: "loki"
      com.aquify.env: "staging"

  # ---------------------------------------------------------------------------
  # Staging-only: Local mail catcher
  # ---------------------------------------------------------------------------

  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    <<: *default-restart
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit_staging_data:/data
    networks:
      - aquify-net
    mem_limit: 64m
    cpus: "0.1"
    labels:
      com.aquify.service: "mailpit"
      com.aquify.env: "staging"

  # ---------------------------------------------------------------------------
  # Staging-only: Internal status/uptime monitoring
  # ---------------------------------------------------------------------------

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.17@sha256:70233f4acb5163fd2a59a49909cf01e44415cecff13dba69e3a86647a2919f83
    <<: *default-restart
    ports:
      - "127.0.0.1:3002:3001"
    volumes:
      - uptime_kuma_staging_data:/app/data
    networks:
      - aquify-net
    mem_limit: 128m
    cpus: "0.1"
    labels:
      com.aquify.service: "uptime-kuma"
      com.aquify.env: "staging"

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local
  minio_staging_data:
    driver: local
  prometheus_staging_data:
    driver: local
  grafana_staging_data:
    driver: local
  loki_staging_data:
    driver: local
  mailpit_staging_data:
    driver: local
  uptime_kuma_staging_data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------

networks:
  aquify-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
