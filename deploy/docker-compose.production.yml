name: aquify-production

x-restart: &always-restart
  restart: always

x-logging: &default-logging
  logging:
    driver: loki
    options:
      loki-url: "http://loki:3100/loki/api/v1/push"
      loki-pipeline-stages: |
        - json:
            expressions:
              level: level
              msg: msg
      max-size: "50m"
      max-file: "5"

services:
  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------

  aquify-api:
    image: ghcr.io/${GHCR_NAMESPACE:?set GHCR_NAMESPACE to the registry owner}/aquify-api:${IMAGE_TAG:-latest}
    <<: *always-restart
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      API_ADDR: ":8080"
      AUTH_ENABLE_DEV_STUB_TOKENS: "false"
      AUTH_ALLOW_DEV_SESSION_ISSUE: "false"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/aquify-api", "healthcheck", "http://localhost:8080/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aquify-net
    mem_limit: 1g
    cpus: "1.0"
    labels:
      com.aquify.service: "api"
      com.aquify.env: "production"
    <<: *default-logging

  aquify-admin:
    image: ghcr.io/${GHCR_NAMESPACE:?set GHCR_NAMESPACE to the registry owner}/aquify-admin:${IMAGE_TAG:-latest}
    <<: *always-restart
    depends_on:
      aquify-api:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://aquify-api:8080
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_AUTH_ENABLE_DEV_STUB_TOKENS: "false"
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aquify-net
    mem_limit: 512m
    cpus: "0.5"
    labels:
      com.aquify.service: "admin"
      com.aquify.env: "production"
    <<: *default-logging

  aquify-worker:
    image: ghcr.io/${GHCR_NAMESPACE:?set GHCR_NAMESPACE to the registry owner}/aquify-api:${IMAGE_TAG:-latest}
    command: ["worker"]
    <<: *always-restart
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      AUTH_ENABLE_DEV_STUB_TOKENS: "false"
    networks:
      - aquify-net
    mem_limit: 512m
    cpus: "0.5"
    labels:
      com.aquify.service: "worker"
      com.aquify.env: "production"
    <<: *default-logging

  # ---------------------------------------------------------------------------
  # Data Services
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    <<: *always-restart
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aquify}
      POSTGRES_USER: ${POSTGRES_USER:-aquify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=8MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=5242kB
        -c min_wal_size=2GB
        -c max_wal_size=8GB
        -c max_worker_processes=4
        -c max_parallel_workers_per_gather=2
        -c max_parallel_workers=4
        -c log_min_duration_statement=1000
        -c log_checkpoints=on
        -c log_connections=on
        -c log_lock_waits=on
        -c log_temp_files=0
        -c track_io_timing=on
        -c ssl=off
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquify} -d ${POSTGRES_DB:-aquify}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - aquify-net
    mem_limit: 1g
    cpus: "1.0"
    labels:
      com.aquify.service: "postgres"
      com.aquify.env: "production"

  redis:
    image: redis:7-alpine
    <<: *always-restart
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --appendonly yes
        --appendfsync always
        --aof-use-rdb-preamble yes
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
        --save 60 10000
        --tcp-keepalive 300
        --tcp-backlog 511
    volumes:
      - redis_production_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - aquify-net
    mem_limit: 384m
    cpus: "0.5"
    labels:
      com.aquify.service: "redis"
      com.aquify.env: "production"

  minio:
    image: minio/minio:latest
    <<: *always-restart
    command: server /data --console-address ":9001"
    env_file:
      - .env.production
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: https://minio.aquify.club
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_production_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - aquify-net
    mem_limit: 1g
    cpus: "1.0"
    labels:
      com.aquify.service: "minio"
      com.aquify.env: "production"

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    <<: *always-restart
    command: start --optimized
    env_file:
      - .env.production
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aquify}
      KC_DB_USERNAME: ${POSTGRES_USER:-aquify}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: auth.aquify.club
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8081"
      KC_PROXY: edge
      KC_LOG_LEVEL: WARN
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./keycloak/production-realm.json:/opt/keycloak/data/import/production-realm.json:ro
    networks:
      - aquify-net
    mem_limit: 768m
    cpus: "0.75"
    labels:
      com.aquify.service: "keycloak"
      com.aquify.env: "production"
    <<: *default-logging

  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    <<: *always-restart
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./prometheus/prometheus.production.yml:/etc/prometheus/prometheus.yml:ro
      - ../docs/observability/prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_production_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - aquify-net
    mem_limit: 512m
    cpus: "0.5"
    labels:
      com.aquify.service: "prometheus"
      com.aquify.env: "production"

  grafana:
    image: grafana/grafana:latest
    <<: *always-restart
    env_file:
      - .env.production
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.aquify.club
      GF_INSTALL_PLUGINS: grafana-loki-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_production_data:/var/lib/grafana
      - ../docs/observability/grafana:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources.production.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - aquify-net
    mem_limit: 512m
    cpus: "0.5"
    labels:
      com.aquify.service: "grafana"
      com.aquify.env: "production"

  loki:
    image: grafana/loki:latest
    <<: *always-restart
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_production_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - aquify-net
    mem_limit: 512m
    cpus: "0.5"
    labels:
      com.aquify.service: "loki"
      com.aquify.env: "production"

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------

volumes:
  postgres_production_data:
    driver: local
  redis_production_data:
    driver: local
  minio_production_data:
    driver: local
  prometheus_production_data:
    driver: local
  grafana_production_data:
    driver: local
  loki_production_data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------

networks:
  aquify-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
