# Prometheus config for the production stack (mounted by docker-compose.production.yml).
# The API and the worker each serve /metrics on METRICS_ADDR (set it to :9091
# in .env.production). Both are reachable only on the internal docker network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: dare-api
    static_configs:
      - targets: ["dare-api:9091"]
  - job_name: dare-worker
    static_configs:
      - targets: ["dare-worker:9091"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
