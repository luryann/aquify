name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  openapi-lint:
    name: Validate OpenAPI Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Lint OpenAPI spec
        run: spectral lint docs/api/openapi.yaml --ruleset docs/api/.spectral.yaml

  server-test:
    name: Server Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Run meetfiles tests
        working-directory: internal/meetfiles
        run: go test ./...

      - name: Run server tests
        working-directory: server
        run: go test ./...

      - name: Run meetfiles vet
        working-directory: internal/meetfiles
        run: go vet ./...

      - name: Run server vet
        working-directory: server
        run: go vet ./...

  admin-build:
    name: Admin Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Lint
        working-directory: admin
        run: npm run lint

      - name: Production build
        working-directory: admin
        run: npm run build
