                properties:
                  status: { type: string }
                  count: { type: integer }
                  commitments:
                    type: array
                    items: { $ref: "#/components/schemas/Commitment" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /meets/{meetID}/commitments/{commitmentID}/respond:
    post:
      tags: [Commitments]
      summary: Parent responds to commitment (yes/no)
      operationId: respondToCommitment
      parameters:
        - $ref: "#/components/parameters/MeetID"
        - $ref: "#/components/parameters/CommitmentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response:
                  type: string
                  enum: [committed_yes, committed_no]
                notes: { type: string }
      responses:
        "200":
          description: Commitment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  commitment: { $ref: "#/components/schemas/Commitment" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /meets/{meetID}/commitments/{commitmentID}/event-selections:
    get:
      tags: [Commitments]
      summary: List event selections for commitment
      operationId: listCommitmentEventSelections
      parameters:
        - $ref: "#/components/parameters/MeetID"
        - $ref: "#/components/parameters/CommitmentID"
      responses:
        "200":
          description: Event selection list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  count: { type: integer }
                  selections:
                    type: array
                    items: { $ref: "#/components/schemas/EventSelection" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Commitments]
      summary: Select event for commitment
      operationId: selectCommitmentEvent
      parameters:
        - $ref: "#/components/parameters/MeetID"
        - $ref: "#/components/parameters/CommitmentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meet_event_id]
              properties:
                meet_event_id: { type: string, format: uuid }
                seed_time_ms: { type: [integer, "null"] }
      responses:
        "201":
          description: Event selected
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  selection: { $ref: "#/components/schemas/EventSelection" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /meets/{meetID}/commitments/{commitmentID}/event-selections/{selectionID}:
    delete:
      tags: [Commitments]
      summary: Remove event selection
      operationId: removeCommitmentEventSelection
      parameters:
        - $ref: "#/components/parameters/MeetID"
        - $ref: "#/components/parameters/CommitmentID"
        - name: selectionID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Selection removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: removed }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /meets/{meetID}/lock-commitments:
    post:
      tags: [Commitments]
      summary: Close commitments for meet (coach/admin)
      description: >-
        Moves the meet to commitment_closed. Commitments answered `committed_yes`
        (or `coach_reviewed`) become `locked`, and each of their event selections
        becomes a `submitted` entry for coach review. Declined and unanswered
        commitments keep their status.
      operationId: lockCommitments
      parameters:
        - $ref: "#/components/parameters/MeetID"
      responses:
        "200":
          description: Commitments locked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  meet: { $ref: "#/components/schemas/Meet" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /meets/{meetID}/entries:
    get:
      tags: [Entries]
      summary: List entries for meet
      operationId: listEntries
      parameters:
        - $ref: "#/components/parameters/MeetID"
      responses:
        "200":
          description: Entry list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  count: { type: integer }
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/Entry" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Entries]
      summary: Propose entry
      operationId: proposeEntry
      parameters:
        - $ref: "#/components/parameters/MeetID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposeEntryRequest" }
      responses:
        "201":
          description: Entry proposed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  entry: { $ref: "#/components/schemas/Entry" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /meets/{meetID}/entries/sd3:
    post:
      tags: [Entries]
      summary: Export SD3 entry file (coach/admin)
      description: >-
        Generates an SDIF (.sd3) entry file for the host meet from approved and
        previously exported individual entries, then marks approved entries as
        `exported`. Requires meet status `entry_finalized` or `completed` and a
        club team code in org settings (422 `team_code_required` otherwise).
        Relay entries are not included (count returned in `X-Skipped-Relays`).
      operationId: exportEntriesSD3
      parameters:
        - $ref: "#/components/parameters/MeetID"
        - name: variant
          in: query
          required: false
          schema: { type: string, enum: [extended, standard], default: extended }
          description: "`extended` includes seed times; `standard` writes NT seeds."
      responses:
        "200":
          description: SD3 entry file
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Entry-Count: { schema: { type: integer } }
            X-Skipped-Relays: { schema: { type: integer } }
          content:
            text/plain:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /meets/{meetID}/entries/{entryID}/override:
    post:
      tags: [Entries]
      summary: Coach override — reassign swimmer event (requires reason, audited)
      operationId: overrideEntry
      parameters:
        - $ref: "#/components/parameters/MeetID"
        - $ref: "#/components/parameters/EntryID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_meet_event_id, reason]
              properties:
                new_meet_event_id: { type: string, format: uuid }
                seed_time_ms: { type: [integer, "null"] }
                reason: { type: string }
      responses:
        "200":
          description: Entry overridden
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  entry: { $ref: "#/components/schemas/Entry" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /meets/{meetID}/entries/{entryID}/approve:
    post:
      tags: [Entries]
      summary: Approve entry (coach/admin)
      operationId: approveEntry
      parameters:
        - $ref: "#/components/parameters/MeetID"
        - $ref: "#/components/parameters/EntryID"
      responses:
        "200":
          description: Entry approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  entry: { $ref: "#/components/schemas/Entry" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /meets/{meetID}/entries/{entryID}:
    delete:
      tags: [Entries]
      summary: Scratch entry (coach/admin)
      description: >
        Soft-scratches an entry. The record is retained (status becomes
        `scratched`) but excluded from reports and exports. Blocked once the
        meet is finalized/closed or the entry has been exported.
      operationId: scratchEntry
      parameters:
        - $ref: "#/components/parameters/MeetID"
        - $ref: "#/components/parameters/EntryID"
        - name: reason
          in: query
          required: false
          schema: { type: string }
          description: Optional reason recorded on the audit event.
      responses:
        "200":
          description: Entry scratched
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  entry: { $ref: "#/components/schemas/Entry" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ── Exports (meet-scoped) ─────────────────────────────────────────────────

  /meets/{meetID}/results/import:
    post:
      tags: [Performance]
      summary: Import meet results file (coach/admin)
      description: >-
        Uploads an SD3/CL2 results file (or an HY3/ZIP archive containing one).
        Individual swims are matched to club swimmers by USA Swimming ID, then
        first + last name and date of birth (gender breaks ties), and recorded
        as official results, which recomputes best times. Swims already
        recorded for the swimmer/event at this meet are counted as duplicates,
        so re-importing is safe. Unmatched swims are returned for follow-up.
      operationId: importMeetResults
      parameters:
        - $ref: "#/components/parameters/MeetID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  imported: { type: integer }
                  duplicates: { type: integer }
                  skipped: { type: integer, description: "Relays and swims with no time (NT/NS/SCR/DNF)." }
                  unmatched:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        uss_number: { type: string }
                        event: { type: string }
                        reason: { type: string }
                  warnings: { type: array, items: { type: string } }
                  new_team_records:
                    type: array
                    description: Team records broken by this import (age group and Open); status pending means the standing record is locked.
                    items: { $ref: "#/components/schemas/RecordBreak" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /meets/{meetID}/exports:
    get:
      tags: [Exports]
      summary: List exports for meet
      operationId: listMeetExports
      parameters:
        - $ref: "#/components/parameters/MeetID"
      responses:
        "200":
          description: Export list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  exports:
                    type: array
                    items: { $ref: "#/components/schemas/FileExport" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Exports]
      summary: Generate PDF report for meet
      description: >
        Generates a human-readable PDF report assembled server-side from the
        meet's approved (non-scratched) entries. The client sends only the
        report type and, for entry reports, the grouping.
      operationId: generateReport
      parameters:
        - $ref: "#/components/parameters/MeetID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateReportRequest" }
      responses:
        "201":
          description: Report job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  export: { $ref: "#/components/schemas/FileExport" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── Exports (standalone) ─────────────────────────────────────────────────

  /exports/{exportID}:
    get:
      tags: [Exports]
      summary: Get export job detail
      operationId: getExport
      parameters:
        - $ref: "#/components/parameters/ExportID"
      responses:
        "200":
          description: Export detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  export: { $ref: "#/components/schemas/FileExport" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /exports/{exportID}/download:
    get:
      tags: [Exports]
      summary: Download generated export file
      operationId: downloadExport
      parameters:
        - $ref: "#/components/parameters/ExportID"
      responses:
        "200":
          description: PDF report content
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Report not yet ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Org settings (export identity) ────────────────────────────────────────────

  /org-settings:
    get:
      tags: [Settings]
      summary: Get org export identity (team code, name, LSC)
      operationId: getOrgSettings
      responses:
        "200":
          description: Org settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  org_settings: { $ref: "#/components/schemas/OrgSettings" }
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Settings]
      summary: Update org export identity (admin)
      operationId: updateOrgSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                team_code: { type: string }
                team_name: { type: string }
                lsc_code: { type: string }
      responses:
        "200":
          description: Org settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  org_settings: { $ref: "#/components/schemas/OrgSettings" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /reports/membership-status:
    get:
      tags: [Reports]
      summary: Generate membership status report
      operationId: runMembershipStatusReport
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
      responses:
        "200":
          description: Membership status report generated
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      report: { type: object }
                  - $ref: "#/components/schemas/ReportArtifactResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reports/meet-fees:
    get:
      tags: [Reports]
      summary: Generate meet fees report
      operationId: runMeetFeesReport
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
      responses:
        "200":
          description: Meet fees report generated
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      report: { type: object }
                  - $ref: "#/components/schemas/ReportArtifactResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reports/invoice-aging:
    get:
      tags: [Reports]
      summary: Generate invoice aging report
      operationId: runInvoiceAgingReport
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
        - name: as_of
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Invoice aging report generated
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      report: { type: object }
                  - $ref: "#/components/schemas/ReportArtifactResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reports/payment-reconciliation:
    get:
      tags: [Reports]
      summary: Generate payment reconciliation report
      operationId: runPaymentReconciliationReport
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
        - name: stripe_reported_cents
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Payment reconciliation report generated
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      report: { type: object }
                  - $ref: "#/components/schemas/ReportArtifactResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reports/registration-status:
    get:
      tags: [Reports]
      summary: Generate registration status report
      operationId: runRegistrationStatusReport
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
      responses:
        "200":
          description: Registration status report generated
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      report: { type: object }
                  - $ref: "#/components/schemas/ReportArtifactResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── Performance ──────────────────────────────────────────────────────────────

  /results:
    post:
      tags: [Performance]
      summary: Upsert swimmer result record
      operationId: upsertResult
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertResultRequest" }
      responses:
        "201":
          description: Result upserted
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { $ref: "#/components/schemas/Result" }
                  new_team_records:
                    type: array
                    items: { $ref: "#/components/schemas/RecordBreak" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /swimmers/{swimmerID}/best-times:
    get:
      tags: [Performance]
      summary: List swimmer best times
      operationId: listBestTimes
      parameters:
        - $ref: "#/components/parameters/SwimmerID"
        - name: course
          in: query
          schema: { type: string, enum: [SCY, SCM, LCM] }
        - name: stroke
          in: query
          schema: { type: string, enum: [free, back, breast, fly, im, free_relay, medley_relay] }
      responses:
        "200":
          description: Best times list
          content:
            application/json:
              schema:
                type: object
                properties:
                  swimmer_id: { type: string }
                  count: { type: integer }
                  best_times:
                    type: array
                    items: { $ref: "#/components/schemas/BestTime" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /swimmers/{swimmerID}/best-times/override:
    post:
      tags: [Performance]
      summary: Manual best-time override (admin/coach, audited)
      operationId: overrideBestTime
      parameters:
        - $ref: "#/components/parameters/SwimmerID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OverrideBestTimeRequest" }
      responses:
        "200":
          description: Best time overridden
          content:
            application/json:
              schema:
                type: object
                properties:
                  best_time: { $ref: "#/components/schemas/BestTime" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /swimmers/{swimmerID}/progression:
    get:
      tags: [Performance]
      summary: Swimmer performance progression timeline
      operationId: getSwimmerProgression
      parameters:
        - $ref: "#/components/parameters/SwimmerID"
        - name: distance
          in: query
          schema: { type: integer }
        - name: stroke
          in: query
          schema: { type: string }
        - name: course
          in: query
          schema: { type: string, enum: [SCY, SCM, LCM] }
      responses:
        "200":
          description: Progression results
          content:
            application/json:
              schema:
                type: object
                properties:
                  swimmer_id: { type: string }
                  count: { type: integer }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Result" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /swimmers/{swimmerID}/activity:
    get:
      tags: [Performance]
      summary: Swimmer household activity feed
      operationId: getSwimmerActivity
      parameters:
        - $ref: "#/components/parameters/SwimmerID"
      responses:
        "200":
          description: Swimmer activity items in reverse chronological order
          content:
            application/json:
              schema:
                type: object
                properties:
                  swimmer_id: { type: string }
                  count: { type: integer }
                  activities:
                    type: array
                    items: { $ref: "#/components/schemas/SwimmerActivity" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /swimmers/{swimmerID}/cut-qualification:
    get:
      tags: [Performance]
      summary: Evaluate swimmer cut qualification against a time standard
      operationId: evaluateCutQualification
      parameters:
        - $ref: "#/components/parameters/SwimmerID"
        - name: standard_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Qualification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  qualification: { type: object }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Team records, top times, goals, relays, progress (performance) ───────

  /performance/records:
    get:
      tags: [Performance]
      summary: Team record board (current record per course × gender × age group × event)
      description: >-
        Readable by every club role. The current record is the fastest accepted
        entry; `previous` is the record it replaced. Staff also see
        `pending_count` (swims awaiting approval because the record is locked).
      operationId: listTeamRecords
      parameters:
        - { name: course, in: query, schema: { type: string, enum: [SCY, SCM, LCM] } }
        - { name: gender, in: query, schema: { type: string, enum: [M, F] } }
        - { name: age_group, in: query, schema: { $ref: "#/components/schemas/RecordAgeGroup" } }
        - { name: distance, in: query, schema: { type: integer } }
        - { name: stroke, in: query, schema: { type: string, enum: [free, back, breast, fly, im] } }
      responses:
        "200":
          description: Record board
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  records: { type: array, items: { $ref: "#/components/schemas/TeamRecord" } }
                  age_groups: { type: array, items: { type: string } }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Performance]
      summary: Add a historical (pre-platform) team record entry (admin, audited)
      operationId: createManualTeamRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateManualRecordRequest" }
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry: { $ref: "#/components/schemas/RecordEntry" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /performance/records/history:
    get:
      tags: [Performance]
      summary: Record history (progression) for one record slot
      description: Staff also receive pending and rejected entries.
      operationId: getTeamRecordHistory
      parameters:
        - { name: course, in: query, required: true, schema: { type: string, enum: [SCY, SCM, LCM] } }
        - { name: gender, in: query, required: true, schema: { type: string, enum: [M, F] } }
        - { name: age_group, in: query, required: true, schema: { $ref: "#/components/schemas/RecordAgeGroup" } }
        - { name: distance, in: query, required: true, schema: { type: integer } }
        - { name: stroke, in: query, required: true, schema: { type: string, enum: [free, back, breast, fly, im] } }
      responses:
        "200":
          description: Record history
          content:
            application/json:
              schema:
                type: object
                properties:
                  history: { $ref: "#/components/schemas/RecordHistory" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /performance/records/pending:
    get:
      tags: [Performance]
      summary: Record entries awaiting approval (admin/coach)
      operationId: listPendingTeamRecords
      responses:
        "200":
          description: Pending entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  entries: { type: array, items: { $ref: "#/components/schemas/RecordEntry" } }
        "403":
          $ref: "#/components/responses/Forbidden"

  /performance/records/rebuild:
    post:
      tags: [Performance]
      summary: Recompute result-based record entries from all official results (admin, audited)
      description: >-
        Slots whose current record is locked are skipped. Manual, verified and
        rejected entries are preserved; rejected swims are never re-added.
      operationId: rebuildTeamRecords
      responses:
        "200":
          description: Rebuild summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    properties:
                      slots_evaluated: { type: integer }
                      slots_skipped_locked: { type: integer }
                      entries_removed: { type: integer }
                      entries_created: { type: integer }
        "403":
          $ref: "#/components/responses/Forbidden"

  /performance/records/{entryID}:
    parameters:
      - { name: entryID, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Performance]
      summary: Lock/verify/annotate a record entry; edit swim facts of manual entries (admin, audited)
      operationId: updateTeamRecordEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                locked: { type: boolean }
                verified: { type: boolean }
                notes: { type: string, maxLength: 1000 }
                swimmer_name: { type: string, maxLength: 120 }
                swim_date: { type: string, format: date }
                meet_name: { type: string, maxLength: 200 }
                time_ms: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry: { $ref: "#/components/schemas/RecordEntry" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Performance]
      summary: Delete a manual record entry (admin, audited); result entries must be rejected instead
      operationId: deleteTeamRecordEntry
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  id: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /performance/records/{entryID}/approve:
    parameters:
      - { name: entryID, in: path, required: true, schema: { type: string } }
    post:
      tags: [Performance]
      summary: Approve a pending record entry (admin, audited)
      operationId: approveTeamRecordEntry
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Approved entry (now accepted and verified)
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry: { $ref: "#/components/schemas/RecordEntry" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /performance/records/{entryID}/reject:
    parameters:
      - { name: entryID, in: path, required: true, schema: { type: string } }
    post:
      tags: [Performance]
      summary: Reject a pending or accepted result-based record entry (admin, audited)
      operationId: rejectTeamRecordEntry
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Rejected entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry: { $ref: "#/components/schemas/RecordEntry" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /performance/records/{entryID}/announcement:
    parameters:
      - { name: entryID, in: path, required: true, schema: { type: string } }
    post:
      tags: [Performance]
      summary: Create a draft "new team record" announcement (admin/coach, audited)
      operationId: draftTeamRecordAnnouncement
      responses:
        "201":
          description: Draft announcement (audience all); publish it from /announcements
          content:
            application/json:
              schema:
                type: object
                properties:
                  announcement: { type: object }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /performance/top-times:
    get:
      tags: [Performance]
      summary: Top-N lists (one best swim per swimmer) per event
      description: >-
        Readable by every club role. Age group is evaluated per swim (age on
        the swim date, which is the meet start date when the result belongs to
        a meet). Omit distance/stroke for every event; omit gender for both.
        Ties share a rank.
      operationId: listTopTimes
      parameters:
        - { name: course, in: query, schema: { type: string, enum: [SCY, SCM, LCM], default: SCY } }
        - { name: gender, in: query, schema: { type: string, enum: [M, F] } }
        - { name: age_group, in: query, schema: { $ref: "#/components/schemas/RecordAgeGroup" } }
        - { name: distance, in: query, schema: { type: integer } }
        - { name: stroke, in: query, schema: { type: string, enum: [free, back, breast, fly, im] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 100 } }
      responses:
        "200":
          description: Ranked lists
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  lists: { type: array, items: { $ref: "#/components/schemas/TopTimesList" } }
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /performance/goals:
    get:
      tags: [Performance]
      summary: Active goals with progress (staff all swimmers; families own household)
      operationId: listOrgGoals
      parameters:
        - { name: swimmer_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Goals
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  total: { type: integer }
                  goals: { type: array, items: { $ref: "#/components/schemas/GoalProgress" } }
        "403":
          $ref: "#/components/responses/Forbidden"

  /swimmers/{swimmerID}/goals:
    parameters:
      - $ref: "#/components/parameters/SwimmerID"
    get:
      tags: [Performance]
      summary: Swimmer goals with progress (household-scoped for parent/swimmer)
      operationId: listSwimmerGoals
      parameters:
        - { name: include_archived, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Goals
          content:
            application/json:
              schema:
                type: object
                properties:
                  swimmer_id: { type: string }
                  count: { type: integer }
                  goals: { type: array, items: { $ref: "#/components/schemas/GoalProgress" } }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Performance]
      summary: Create a goal (admin/coach any swimmer; parent/swimmer own household; audited)
      operationId: createSwimmerGoal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGoalRequest" }
      responses:
        "201":
          description: Goal created
          content:
            application/json:
              schema:
                type: object
                properties:
                  goal: { $ref: "#/components/schemas/GoalProgress" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /swimmers/{swimmerID}/goals/{goalID}:
    parameters:
      - $ref: "#/components/parameters/SwimmerID"
      - { name: goalID, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Performance]
      summary: Update or archive a goal (same access rules as create; audited)
      operationId: updateSwimmerGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                target_time_ms: { type: integer, minimum: 1 }
                deadline: { type: string, description: "YYYY-MM-DD; empty string clears" }
                notes: { type: string, maxLength: 500 }
                status: { type: string, enum: [active, archived] }
      responses:
        "200":
          description: Goal updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  goal: { $ref: "#/components/schemas/GoalProgress" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Performance]
      summary: Delete a goal (same access rules as create; audited)
      operationId: deleteSwimmerGoal
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  id: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /performance/relays/optimize:
    post:
      tags: [Performance]
      summary: Propose optimal A/B/C relays from flat-start best times (admin/coach)
      description: >-
        Relay A is the fastest possible relay, B the fastest from the rest, and
        so on. Medley relays are solved as an exact assignment problem.
        Mixed (X) relays use exactly two men and two women. Age group is
        evaluated on the meet start date (or `as_of`). Locked legs are honored
        and excluded swimmers are never used.
      operationId: optimizeRelays
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelayOptimizeRequest" }
      responses:
        "200":
          description: Relay proposal
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal: { $ref: "#/components/schemas/RelayProposal" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /performance/relay-lineups:
    get:
      tags: [Performance]
      summary: Saved relay lineups (admin/coach)
      operationId: listRelayLineups
      parameters:
        - { name: meet_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Lineups
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  total: { type: integer }
                  lineups: { type: array, items: { $ref: "#/components/schemas/RelayLineup" } }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Performance]
      summary: Save a relay lineup for a meet (admin/coach, audited)
      operationId: createRelayLineup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelayLineupRequest" }
      responses:
        "201":
          description: Lineup saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  lineup: { $ref: "#/components/schemas/RelayLineup" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /performance/relay-lineups/{lineupID}:
    parameters:
      - { name: lineupID, in: path, required: true, schema: { type: string } }
    put:
      tags: [Performance]
      summary: Replace a saved relay lineup (admin/coach, audited)
      operationId: replaceRelayLineup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelayLineupRequest" }
      responses:
        "200":
          description: Lineup saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  lineup: { $ref: "#/components/schemas/RelayLineup" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Performance]
      summary: Delete a saved relay lineup (admin/coach, audited)
      operationId: deleteRelayLineup
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  id: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /performance/progress-report:
    get:
      tags: [Performance]
      summary: Time drops between a baseline and a comparison period, with a most-improved list
      description: >-
        Compares each swimmer's best time per event in period A against period
        B (two date ranges or two seasons). Staff see every swimmer;
        parent/swimmer callers see only their household.
      operationId: getProgressReport
      parameters:
        - { name: from_a, in: query, required: true, schema: { type: string, format: date } }
        - { name: to_a, in: query, required: true, schema: { type: string, format: date } }
        - { name: from_b, in: query, required: true, schema: { type: string, format: date } }
        - { name: to_b, in: query, required: true, schema: { type: string, format: date } }
        - { name: group_code, in: query, schema: { type: string } }
        - { name: swimmer_id, in: query, schema: { type: string } }
        - { name: course, in: query, schema: { type: string, enum: [SCY, SCM, LCM] } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 50 } }
      responses:
        "200":
          description: Progress report
          content:
            application/json:
              schema:
                type: object
                properties:
                  report: { $ref: "#/components/schemas/ProgressReport" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /time-standards:
    get:
      tags: [Performance]
      summary: List time standards
      operationId: listTimeStandards
      parameters:
        - name: season_year
          in: query
          schema: { type: integer }
        - name: standard_code
          in: query
          schema: { type: string }
        - name: event_distance
          in: query
          schema: { type: integer }
        - name: stroke
          in: query
          schema: { type: string }
        - name: course
          in: query
          schema: { type: string, enum: [SCY, SCM, LCM] }
        - name: gender
          in: query
          schema: { type: string, enum: [M, F, X] }
        - name: active_only
          in: query
