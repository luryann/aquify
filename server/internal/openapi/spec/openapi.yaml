      summary: Swimmer practice attendance rate
      description: Admin/coach or the swimmer's household. Eligible practices are non-rest practices for the swimmer's groups (or all-group practices); `attendance_pct` = present / (present + absent), excused and unmarked excluded.
      operationId: getSwimmerAttendanceSummary
      parameters:
        - { name: swimmerID, in: path, required: true, schema: { type: string } }
        - { name: days, in: query, schema: { type: integer, maximum: 365, default: 90 } }
      responses:
        "200": { description: Summary, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

