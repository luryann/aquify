    # Common ───────────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: [object, "null"]
              additionalProperties: true

    AuditMeta:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string }
        updated_by: { type: string }

    # Auth ─────────────────────────────────────────────────────────────────────
    OIDCCallbackRequest:
      type: object
      required: [code, state]
      properties:
        code: { type: string }
        state: { type: string }
        org_id: { type: string }

    OIDCCallbackResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        user:
          type: object
          properties:
            user_id: { type: string }
            org_id: { type: string }
            roles: { type: array, items: { type: string } }
        session: { $ref: "#/components/schemas/SessionMetadata" }
        csrf_token:
          type: string
          description: Returned via Secure CSRF cookie in browser flows; clients should echo it in the configured CSRF header for cookie-backed session mutations.

    IssueSessionRequest:
      type: object
      required: [user_id, org_id, roles]
      properties:
        user_id: { type: string }
        org_id: { type: string }
        household_id: { type: string }
        roles:
          type: array
          minItems: 1
          items: { type: string }
        mfa_authenticated: { type: boolean, default: false }

    SessionResponse:
      type: object
      properties:
        status: { type: string }
        session: { $ref: "#/components/schemas/SessionMetadata" }
        csrf_token:
          type: string
          description: Returned via Secure CSRF cookie in browser flows; clients should echo it in the configured CSRF header for cookie-backed session mutations.

    LogoutResponse:
      type: object
      properties:
        status: { type: string, example: logged_out }
        logout_url:
          type: string
          description: Keycloak end-session URL to visit in a top-level browser navigation when OIDC logout metadata is available.
        redirect_url:
          type: string
          description: App fallback redirect used when an identity-provider logout URL is unavailable.

    SessionMetadata:
      type: object
      properties:
        expires_at: { type: string, format: date-time }

    MFAEnrollResponse:
      type: object
      properties:
        status: { type: string, example: enrolled }
        factor:
          type: object
          properties:
            factor_id: { type: string }
            factor_type: { type: string, enum: [totp, backup_code] }
            label: { type: string }
        next: { type: string }

    AssignRoleRequest:
      type: object
      required: [org_id, target_user_id, role, reason]
      properties:
        org_id: { type: string }
        target_user_id: { type: string }
        role:
          type: string
          enum: [admin, coach, parent, swimmer]
        scope_type: { type: string }
        scope_id: { type: string }
        reason: { type: string }

    AssignRoleResponse:
      type: object
      properties:
        status: { type: string }
        assignment: { type: object }

    UserAttributes:
      type: object
      additionalProperties:
        type: array
        items: { type: string }

    UserRole:
      type: object
      properties:
        id: { type: string }
        name:
          type: string
          enum: [admin, coach, parent, swimmer]
        description: { type: string }
        composite: { type: boolean }
        clientRole: { type: boolean }
        containerId: { type: string }

    UserSummary:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        enabled: { type: boolean }
        emailVerified: { type: boolean }
        attributes: { $ref: "#/components/schemas/UserAttributes" }
        roles:
          type: array
          items:
            type: string
            enum: [admin, coach, parent, swimmer]

    UserDetail:
      allOf:
        - $ref: "#/components/schemas/UserSummary"
        - type: object
          properties:
            createdTimestamp: { type: integer, format: int64 }

    UserListResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        count: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        source: { type: string, enum: [stub, keycloak] }
        is_stubbed: { type: boolean }
        users:
          type: array
          items: { $ref: "#/components/schemas/UserSummary" }

    UserDetailResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        user: { $ref: "#/components/schemas/UserDetail" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/UserRole" }

    CreateUserRequest:
      type: object
      required: [email, password]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        role:
          type: string
          enum: [admin, coach, parent, swimmer]
        temporary_password: { type: boolean, default: false }
        create_household: { type: boolean, default: false }

    InviteUserRequest:
      type: object
      required: [email]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [admin, coach, parent, swimmer]
        create_household: { type: boolean, default: false }

    UpdateUserRequest:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }

    UserMutationResponse:
      type: object
      properties:
        status: { type: string, enum: [created] }
        user_id: { type: string }
        household_id: { type: string }

    UserStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [updated, disabled, enabled, approved, rejected, deleted, assigned, removed, password_reset_sent]

    SelfRegisterRequest:
      type: object
      required: [email, org_id]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        org_id: { type: string }
        requested_role:
          type: string
          enum: [admin, coach, parent, swimmer]
        club_code: { type: string, maxLength: 20 }
        note: { type: string, maxLength: 500 }

    SelfRegisterResponse:
      type: object
      properties:
        status: { type: string, enum: [pending_approval] }
        user_id: { type: string }

    RejectUserRequest:
      type: object
      properties:
        reason: { type: string }

    UserRoleAssignRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, coach, parent, swimmer]

    UserRolesResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        roles:
          type: array
          items: { $ref: "#/components/schemas/UserRole" }

    UserHouseholdResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        household:
          oneOf:
            - { $ref: "#/components/schemas/Household" }
            - { type: "null" }

    HouseholdLinkRequest:
      type: object
      required: [household_id]
      properties:
        household_id: { type: string }

    UserHouseholdLinkResponse:
      type: object
      properties:
        status: { type: string, enum: [linked, unlinked] }
        household_id: { type: string }

    # Members ──────────────────────────────────────────────────────────────────
    Household:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            org_id: { type: string, format: uuid }
            household_name: { type: string }
            primary_email: { type: string, format: email }
            primary_phone_e164: { type: string }
            status:
              type: string
              enum: [active, inactive, archived]
            notes: { type: string }

    HouseholdResponse:
      type: object
      properties:
        status: { type: string }
        household: { $ref: "#/components/schemas/Household" }

    CreateHouseholdRequest:
      type: object
      required: [org_id, household_name]
      properties:
        org_id: { type: string }
        household_name: { type: string }
        primary_email: { type: string, format: email }
        primary_phone_e164: { type: string }
        status:
          type: string
          enum: [active, inactive, archived]
          default: active
        notes: { type: string }

    UpdateHouseholdRequest:
      type: object
      properties:
        household_name: { type: string }
        primary_email: { type: string, format: email }
        primary_phone_e164: { type: string }
        status:
          type: string
          enum: [active, inactive, archived]
        notes: { type: string }

    Contact:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            household_id: { type: string }
            relationship: { type: string }
            first_name: { type: string }
            last_name: { type: string }
            email: { type: string, format: email }
            phone_e164: { type: string }
            is_primary: { type: boolean }
            is_emergency_contact: { type: boolean }
            can_pick_up: { type: boolean }
            emergency_priority: { type: [integer, "null"] }
            notes: { type: string }

    AddContactRequest:
      type: object
      required: [relationship, first_name, last_name]
      properties:
        relationship: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        phone_e164: { type: string }
        is_primary: { type: boolean }
        is_emergency_contact: { type: boolean }
        can_pick_up: { type: boolean }
        emergency_priority: { type: [integer, "null"] }
        notes: { type: string }

    Swimmer:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            org_id: { type: string }
            household_id: { type: string }
            first_name: { type: string }
            last_name: { type: string }
            preferred_name: { type: string }
            date_of_birth: { type: string, format: date }
            gender:
              type: string
              enum: [female, male, non_binary, undisclosed]
            swimmer_external_id: { type: string }
            usa_swimming_id: { type: string, description: "USA-Swimming registration number" }
            registration_status:
              type: string
              enum: [pending, active, inactive, archived]
            medical_flags:
              type: array
              items: { type: string }
            notes: { type: string }

    SwimmerResponse:
      type: object
      properties:
        status: { type: string }
        swimmer: { $ref: "#/components/schemas/Swimmer" }

    CreateSwimmerRequest:
      type: object
      required: [org_id, household_id, first_name, last_name, date_of_birth, gender]
      properties:
        org_id: { type: string }
        household_id: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        preferred_name: { type: string }
        date_of_birth: { type: string, format: date }
        gender:
          type: string
          enum: [female, male, non_binary, undisclosed]
        swimmer_external_id: { type: string }
        usa_swimming_id: { type: string, description: "USA-Swimming registration number" }
        registration_status:
          type: string
          enum: [pending, active, inactive, archived]
        medical_flags:
          type: array
          items: { type: string }
        notes: { type: string }

    UpdateSwimmerRequest:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        preferred_name: { type: string }
        date_of_birth: { type: string, format: date }
        gender:
          type: string
          enum: [female, male, non_binary, undisclosed]
        swimmer_external_id: { type: string }
        usa_swimming_id: { type: string, description: "USA-Swimming registration number" }
        registration_status:
          type: string
          enum: [pending, active, inactive, archived]
        medical_flags:
          type: [array, "null"]
          items: { type: string }
        notes: { type: string }

    # Groups ───────────────────────────────────────────────────────────────────
    Group:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            org_id: { type: string }
            code: { type: string }
            name: { type: string }
            description: { type: string }
            type:
              type: string
              enum: [competitive, recreational, developmental, masters, other]
            min_age: { type: [integer, "null"] }
            max_age: { type: [integer, "null"] }
            coach_user_id: { type: string }
            is_active: { type: boolean }

    CreateGroupRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        type:
          type: string
          enum: [competitive, recreational, developmental, masters, other]
        min_age: { type: [integer, "null"] }
        max_age: { type: [integer, "null"] }
        coach_user_id: { type: string }

    UpdateGroupRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        type:
          type: string
          enum: [competitive, recreational, developmental, masters, other]
        min_age: { type: [integer, "null"] }
        max_age: { type: [integer, "null"] }
        coach_user_id: { type: string }
        is_active: { type: boolean }

    Registration:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            org_id: { type: string }
            household_id: { type: string }
            swimmer_id: { type: string }
            group_id: { type: string }
            season: { type: string }
            registration_date: { type: string, format: date }
            status:
              type: string
              enum: [pending, active, inactive, withdrawn]
            notes: { type: string }

    CreateRegistrationRequest:
      type: object
      required: [household_id, swimmer_id, group_id, season]
      properties:
        household_id: { type: string }
        swimmer_id: { type: string }
        group_id: { type: string }
        season: { type: string }
        registration_date: { type: string, format: date }
        notes: { type: string }

    # Meets ────────────────────────────────────────────────────────────────────
    Meet:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            org_id: { type: string }
            name: { type: string }
            meet_type:
              type: string
              enum: [invitational, dual_meet, time_trial, championship, other]
            course:
              type: string
              enum: [SCY, SCM, LCM]
            status:
              type: string
              enum: [draft, published, commitment_open, commitment_closed, entry_finalized, completed, archived]
            start_date: { type: string, format: date }
            end_date: { type: string, format: date }
            entry_deadline: { type: string, format: date-time }
            commitment_deadline: { type: string, format: date-time }
            host_org: { type: string }
            location: { type: string }
            self_signup_enabled: { type: boolean }
            max_entries_per_swimmer: { type: integer, minimum: 1 }

    CreateMeetRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        meet_type:
          type: string
          enum: [invitational, dual_meet, time_trial, championship, other]
        course:
          type: string
          enum: [SCY, SCM, LCM]
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        entry_deadline: { type: string, format: date-time }
        commitment_deadline: { type: string, format: date-time }
        host_org: { type: string }
        location: { type: string }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/CreateMeetSessionRequest" }
        events:
          type: array
          items: { $ref: "#/components/schemas/CreateMeetEventDraftRequest" }
        signup_settings: { $ref: "#/components/schemas/CreateMeetSignupSettingsRequest" }

    MeetSession:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            meet_id: { type: string }
            session_number: { type: integer }
            name: { type: string }
            session_date: { type: string, format: date }
            warmup_time: { type: string }
            start_time: { type: string }
            notes: { type: string }

    CreateMeetSessionRequest:
      type: object
      required: [session_number, name]
      properties:
        session_number: { type: integer, minimum: 1 }
        name: { type: string }
        session_date: { type: string, format: date }
        warmup_time: { type: string }
        start_time: { type: string }
        notes: { type: string }

    MeetEvent:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            meet_id: { type: string }
            session_id: { type: string }
            event_number: { type: string }
            stroke:
              type: string
              enum: [freestyle, backstroke, breaststroke, butterfly, individual_medley, medley_relay, freestyle_relay, other]
            distance: { type: integer }
            course:
              type: string
              enum: [SCY, SCM, LCM]
            gender:
              type: string
              enum: [M, F, X, O]
            min_age: { type: [integer, "null"] }
            max_age: { type: [integer, "null"] }
            entry_fee_cents: { type: integer }
            is_relay: { type: boolean }

    CreateMeetEventRequest:
      type: object
      required: [event_number, stroke, distance]
      properties:
        session_id: { type: string }
        event_number: { type: string }
        stroke:
          type: string
          enum: [freestyle, backstroke, breaststroke, butterfly, individual_medley, medley_relay, freestyle_relay, other]
        distance: { type: integer, minimum: 1 }
        course:
          type: string
          enum: [SCY, SCM, LCM]
        gender:
          type: string
          enum: [M, F, X, O]
        min_age: { type: [integer, "null"] }
        max_age: { type: [integer, "null"] }
        entry_fee_cents: { type: integer, default: 0 }
        is_relay: { type: boolean, default: false }

    CreateMeetEventDraftRequest:
      type: object
      required: [event_number, stroke, distance]
      properties:
        session_number: { type: integer, minimum: 1 }
        event_number: { type: string }
        stroke:
          type: string
          enum: [freestyle, backstroke, breaststroke, butterfly, individual_medley, medley_relay, freestyle_relay, other]
        distance: { type: integer, minimum: 1 }
        course:
          type: string
          enum: [SCY, SCM, LCM]
        gender:
          type: string
          enum: [M, F, X, O]
        min_age: { type: [integer, "null"] }
        max_age: { type: [integer, "null"] }
        entry_fee_cents: { type: integer, default: 0 }
        is_relay: { type: boolean, default: false }

    CreateMeetSignupSettingsRequest:
      type: object
      properties:
        self_signup_enabled: { type: boolean }
        max_entries_per_swimmer: { type: integer, minimum: 1 }

    ParsedMeetSessionDraft:
      type: object
      required: [session_number, section, name]
      properties:
        session_number: { type: integer, minimum: 1 }
        section: { type: string }
        name: { type: string }
        session_date: { type: string, format: date }
        warmup_time: { type: string }
        start_time: { type: string }

    ParsedMeetEventDraft:
      type: object
      required: [event_number, stroke, distance, is_relay]
      properties:
        session_number: { type: integer, minimum: 1 }
        event_number: { type: string }
        stroke:
          type: string
          enum: [freestyle, backstroke, breaststroke, butterfly, individual_medley, medley_relay, freestyle_relay, other]
        distance: { type: integer, minimum: 1 }
        course:
          type: string
          enum: [SCY, SCM, LCM]
        gender:
          type: string
          enum: [M, F, X, O]
        min_age: { type: [integer, "null"] }
        max_age: { type: [integer, "null"] }
        is_relay: { type: boolean }

    ParsedMeetSignupSettings:
      type: object
      required: [self_signup_enabled, max_entries_per_swimmer]
      properties:
        self_signup_enabled: { type: boolean }
        max_entries_per_swimmer: { type: integer, minimum: 1 }

    ParsedMeetFile:
      type: object
      required: [file_type, source_file, sessions, events, signup_settings]
      properties:
        file_type:
          type: string
          enum: [sd3, cl2, hy3, hyv, ev3, zip]
        source_file: { type: string }
        meet_name: { type: string }
        course:
          type: string
          enum: [SCY, SCM, LCM]
        location: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/ParsedMeetSessionDraft" }
        events:
          type: array
          items: { $ref: "#/components/schemas/ParsedMeetEventDraft" }
        signup_settings: { $ref: "#/components/schemas/ParsedMeetSignupSettings" }
        parse_warnings:
          type: array
          items: { type: string }

    Commitment:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            meet_id: { type: string }
            swimmer_id: { type: string }
            household_id: { type: string }
            status:
              type: string
              enum: [invited, committed_yes, committed_no, coach_reviewed, locked]
            notes: { type: string }

    EventSelection:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            commitment_id: { type: string }
            meet_event_id: { type: string }
            seed_time_ms: { type: [integer, "null"] }

    Entry:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            meet_id: { type: string }
            swimmer_id: { type: string }
            meet_event_id: { type: string }
            commitment_id: { type: string }
            status:
              type: string
              enum: [draft, submitted, approved, exported, updated_from_results, archived]
            seed_time_ms: { type: [integer, "null"] }
            is_relay: { type: boolean }

    ProposeEntryRequest:
      type: object
      required: [swimmer_id, meet_event_id]
      properties:
        swimmer_id: { type: string }
        meet_event_id: { type: string }
        commitment_id: { type: string }
        seed_time_ms: { type: [integer, "null"] }
        is_relay: { type: boolean, default: false }

    OrgSettings:
      type: object
      properties:
        org_id: { type: string }
        team_code: { type: string }
        team_name: { type: string }
        lsc_code: { type: string }
        email_sender_name: { type: string }
        email_sender_address: { type: string }
        public_slug: { type: string, description: "3-40 lowercase letters, digits or hyphens; unique across clubs." }
        public_site_enabled: { type: boolean }
        public_show_coaches: { type: boolean }
        public_about: { type: string }
        public_contact_email: { type: string }
        public_contact_phone: { type: string }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
    PublicTeamSite:
      type: object
      properties:
        club:
          type: object
          properties:
            name: { type: string }
            slug: { type: string }
            about: { type: string }
            contact_email: { type: string }
            contact_phone: { type: string }
            join_url: { type: string }
        announcements:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              body: { type: string }
              published_at: { type: string, format: date-time, nullable: true }
        meets:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              start_date: { type: string }
              end_date: { type: string }
              location: { type: string }
              host_org: { type: string }
              course: { type: string }
        events:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              category: { type: string }
              description: { type: string }
              location: { type: string }
              starts_at: { type: string, format: date-time }
              ends_at: { type: string, format: date-time, nullable: true }
              all_day: { type: boolean }
        records:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              course: { type: string }
              gender: { type: string }
              age_group: { type: string }
              distance: { type: integer }
              stroke: { type: string }
              time_ms: { type: integer }
              swimmer_name: { type: string }
              swim_date: { type: string }
              meet_name: { type: string }
        coaches:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              role: { type: string }

    # Exports ──────────────────────────────────────────────────────────────────
    FileExport:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            meet_id: { type: string }
            export_type:
              type: string
              description: The report type this artifact was generated for.
              enum: [eligibility_report, entry_report, event_report]
            status:
              type: string
              enum: [pending, generating, ready, failed, expired]
            filename: { type: string }
            size_bytes: { type: integer }
            storage_key: { type: [string, "null"] }
            download_url: { type: [string, "null"] }
            expires_at: { type: [string, "null"], format: date-time }
            last_error: { type: [string, "null"] }
            entry_count: { type: integer }

    ReportArtifact:
      type: object
      properties:
        id: { type: string }
        org_id: { type: string }
        kind: { type: string }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer }
        storage_key: { type: string }
        download_url: { type: [string, "null"] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    ReportArtifactResponse:
      type: object
      properties:
        report: { type: object }
        artifact: { $ref: "#/components/schemas/ReportArtifact" }
        format: { type: string, enum: [csv] }
        delivery: { type: string, enum: [artifact] }

    GenerateReportRequest:
      type: object
      required: [report_type]
      description: >
        Report data is assembled server-side from the meet's approved entries,
        events, swimmers, and org export identity, so only the report type and
        (for entry reports) the grouping are supplied.
      properties:
        report_type:
          type: string
          enum: [eligibility_report, entry_report, event_report]
        grouping:
          type: string
          description: Grouping for entry reports; ignored for other report types.
          enum: [session, group, alphabetical]

    # Performance ──────────────────────────────────────────────────────────────
    Result:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            swimmer_id: { type: string }
            meet_id: { type: string }
            meet_event_id: { type: string }
            import_id: { type: string }
            event_number: { type: string }
            distance: { type: integer }
            stroke:
              type: string
              enum: [free, back, breast, fly, im, free_relay, medley_relay]
            course:
              type: string
              enum: [SCY, SCM, LCM]
            gender: { type: string, enum: [M, F, X] }
            heat: { type: [integer, "null"] }
            lane: { type: [integer, "null"] }
            place: { type: [integer, "null"] }
            seed_time_ms: { type: [integer, "null"] }
            fin_time_ms: { type: [integer, "null"] }
            dq: { type: boolean }
            dq_code: { type: string }
            is_official: { type: boolean }

    UpsertResultRequest:
      type: object
      required: [swimmer_id, distance, stroke, course, gender]
      properties:
        swimmer_id: { type: string }
        meet_id: { type: string }
        meet_event_id: { type: string }
        import_id: { type: string }
        event_number: { type: string }
        distance: { type: integer, minimum: 1 }
        stroke:
          type: string
          enum: [free, back, breast, fly, im, free_relay, medley_relay]
        course:
          type: string
          enum: [SCY, SCM, LCM]
        gender: { type: string, enum: [M, F, X] }
        heat: { type: [integer, "null"] }
        lane: { type: [integer, "null"] }
        place: { type: [integer, "null"] }
        seed_time_ms: { type: [integer, "null"] }
        fin_time_ms: { type: [integer, "null"] }
        dq: { type: boolean, default: false }
        dq_code: { type: string }
        dq_note: { type: string }
        is_official: { type: boolean, default: true }
        splits:
          type: array
          items:
            type: object
            required: [split_number, split_distance]
            properties:
              split_number: { type: integer, minimum: 1 }
              split_distance: { type: integer, minimum: 1 }
              split_time_ms: { type: integer, minimum: 0 }
              cumulative_time_ms: { type: integer, minimum: 0 }

    BestTime:
      type: object
      properties:
        swimmer_id: { type: string }
        distance: { type: integer }
        stroke: { type: string }
        course: { type: string, enum: [SCY, SCM, LCM] }
        fin_time_ms: { type: integer }
        is_override: { type: boolean }
        recorded_at: { type: string, format: date-time }
        result_id: { type: [string, "null"] }

    SwimmerActivity:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        occurred_at: { type: string, format: date-time }
        title: { type: string }
        detail: { type: string }
        status: { type: string }
        source_id: { type: string }
        meet_id: { type: string }

    OverrideBestTimeRequest:
      type: object
      required: [event_distance, stroke, course, reason]
      properties:
        event_distance: { type: integer, minimum: 1 }
        stroke:
          type: string
          enum: [free, back, breast, fly, im]
        course:
          type: string
          enum: [SCY, SCM, LCM]
        best_time_ms: { type: [integer, "null"] }
        reason: { type: string }
        recorded_at: { type: string, format: date-time }

    TimeStandard:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            name: { type: string }
            season_year: { type: integer }
            standard_code: { type: string }
            description: { type: string }
            event_distance: { type: integer }
            stroke: { type: string }
            course: { type: string, enum: [SCY, SCM, LCM] }
            gender: { type: string, enum: [M, F, X] }
            age_min: { type: [integer, "null"] }
            age_max: { type: [integer, "null"] }
            time_ms: { type: integer }
            is_active: { type: boolean }

    CreateTimeStandardRequest:
      type: object
      required: [name, season_year, standard_code, event_distance, stroke, course, gender, time_ms]
      properties:
        name: { type: string }
        season_year: { type: integer, minimum: 2001 }
        standard_code: { type: string }
        description: { type: string }
        event_distance: { type: integer, minimum: 1 }
        stroke:
          type: string
          enum: [free, back, breast, fly, im]
        course:
          type: string
          enum: [SCY, SCM, LCM]
        gender:
          type: string
          enum: [M, F, X]
        age_min: { type: [integer, "null"] }
        age_max: { type: [integer, "null"] }
        time_ms: { type: integer, minimum: 1 }
        is_active: { type: boolean, default: true }

    # Billing ──────────────────────────────────────────────────────────────────
    Invoice:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            org_id: { type: string }
            household_id: { type: string }
            invoice_number: { type: string }
            status:
              type: string
              enum: [draft, issued, partially_paid, paid, refunded_partial, refunded_full, voided, written_off]
            total_cents: { type: integer }
            paid_cents: { type: integer }
            refunded_cents: { type: integer }
            due_date: { type: string, format: date }
            notes: { type: string }
            external_ref: { type: string }

    CreateInvoiceRequest:
      type: object
      required: [invoice_number]
      properties:
        household_id: { type: string }
        invoice_number: { type: string }
        due_date: { type: string, format: date }
        notes: { type: string }
        external_ref: { type: string }

    InvoiceItem:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            invoice_id: { type: string }
            description: { type: string }
            quantity: { type: integer }
            unit_amount_cents: { type: integer }
            total_cents: { type: integer }
            category:
              type: string
              enum: [program_fee, meet_fee, equipment, manual, late_fee, credit]
            swimmer_id: { type: string }
            meet_id: { type: string }

    AddInvoiceItemRequest:
      type: object
      required: [description, quantity, unit_amount_cents, category]
      properties:
        description: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit_amount_cents: { type: integer, minimum: 1 }
        category:
          type: string
          enum: [program_fee, meet_fee, equipment, manual, late_fee, credit]
        swimmer_id: { type: string }
        meet_id: { type: string }

    Payment:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            invoice_id: { type: string }
            amount_cents: { type: integer }
            method:
              type: string
              enum: [stripe, check, cash, ach, other]
            status:
              type: string
              enum: [pending, succeeded, failed]
            stripe_payment_intent_id: { type: string }
            external_ref: { type: string }
            notes: { type: string }

    RecordPaymentRequest:
      type: object
      required: [amount_cents, method]
      properties:
        amount_cents: { type: integer, minimum: 1 }
        method:
          type: string
          enum: [stripe, check, cash, ach, other]
        stripe_payment_intent_id: { type: string }
        external_ref: { type: string }
        notes: { type: string }

    Refund:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            invoice_id: { type: string }
            payment_id: { type: string }
            amount_cents: { type: integer }
            reason: { type: string }
            status:
              type: string
              enum: [pending, processed, failed]
            stripe_refund_id: { type: string }

    CreateRefundRequest:
      type: object
      required: [payment_id, amount_cents, reason]
      properties:
        payment_id: { type: string }
        amount_cents: { type: integer, minimum: 1 }
        reason: { type: string }

    HouseholdAutopayStatus:
      type: object
      properties:
        household_id: { type: string }
        enabled: { type: boolean }
        payment_method_type:
          type: string
          enum: [card, ach]
        payment_method_brand: { type: string }
        payment_method_last4: { type: string }
        payment_method_label: { type: string }
        payment_method_external_ref: { type: string }
        payment_method_exp_month: { type: integer }
        payment_method_exp_year: { type: integer }
        trigger_days_before_due:
          type: integer
          enum: [0, 3, 7]
        next_charge_date:
          type: string
          format: date
        next_charge_amount_cents: { type: integer }
        next_invoice_id: { type: string }

    UpsertHouseholdAutopayRequest:
      type: object
      required: [payment_method_type, payment_method_label]
      properties:
        payment_method_type:
          type: string
          enum: [card, ach]
        payment_method_brand: { type: string }
        payment_method_last4: { type: string }
        payment_method_label: { type: string, maxLength: 120 }
        payment_method_external_ref: { type: string }
        payment_method_exp_month: { type: integer }
        payment_method_exp_year: { type: integer }
        trigger_days_before_due:
          type: integer
          enum: [0, 3, 7]

    LedgerEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string }
        invoice_id: { type: string }
        event_type: { type: string }
        amount_cents: { type: integer }
        running_balance_cents: { type: integer }
        actor_id: { type: string }
        created_at: { type: string, format: date-time }

    # Stripe ───────────────────────────────────────────────────────────────────
    CreatePaymentIntentRequest:
      type: object
      required: [invoice_id, amount_cents]
      properties:
        invoice_id: { type: string }
        amount_cents: { type: integer, minimum: 1 }
        description: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }

    CreateCheckoutSessionRequest:
      type: object
      required: [invoice_id, amount_cents, success_url, cancel_url]
      properties:
        invoice_id: { type: string }
        amount_cents: { type: integer, minimum: 1 }
        description: { type: string }
        success_url: { type: string, format: uri }
        cancel_url: { type: string, format: uri }
        metadata:
          type: object
          additionalProperties: { type: string }

    # Communications ───────────────────────────────────────────────────────────
    Announcement:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            org_id: { type: string }
            title: { type: string }
            body: { type: string }
            audience:
              type: string
              enum: [all, group]
            group_id: { type: string }
            public: { type: boolean }
            status:
              type: string
              enum: [draft, published, archived]
            published_at: { type: [string, "null"], format: date-time }

    CreateAnnouncementRequest:
      type: object
      required: [title, body, audience]
      properties:
        title: { type: string, maxLength: 255 }
        body: { type: string }
        audience:
          type: string
          enum: [all, group]
        group_id: { type: string }
        public: { type: boolean }

    EmailCampaign:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            org_id: { type: string }
            name: { type: string }
            subject: { type: string }
            body_html: { type: string }
            body_text: { type: string }
            from_name: { type: string }
            from_email: { type: string, format: email }
            audience:
              type: string
              enum: [all, group]
            group_id: { type: string }
            status:
              type: string
              enum: [draft, sending, sent, failed]
            sent_count: { type: integer }
            failed_count: { type: integer }
            suppressed_count: { type: integer }
            total_recipients: { type: integer }

    CreateEmailCampaignRequest:
      type: object
      required: [name, subject, body_html, from_name, from_email, audience]
      properties:
        name: { type: string, maxLength: 255 }
        subject: { type: string, maxLength: 255 }
        body_html: { type: string }
        body_text: { type: string }
        from_name: { type: string }
        from_email: { type: string, format: email }
        audience:
          type: string
          enum: [all, group]
        group_id: { type: string }

    SuppressionEntry:
      allOf:
        - $ref: "#/components/schemas/AuditMeta"
        - type: object
          properties:
            email: { type: string, format: email }
            reason:
              type: string
              enum: [bounce, complaint, manual]

    # Audit ────────────────────────────────────────────────────────────────────
    CommunicationPreference:
      type: object
      required: [event_id, label, description, email_enabled, push_enabled]
      properties:
        event_id: { type: string }
        label: { type: string }
        description: { type: string }
        email_enabled: { type: boolean }
        push_enabled: { type: boolean }

    UpdateCommunicationPreferencesRequest:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          minItems: 1
          items:
            type: object
            required: [event_id, email_enabled, push_enabled]
            properties:
              event_id: { type: string }
              email_enabled: { type: boolean }
              push_enabled: { type: boolean }

    AuditEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string }
        actor_user_id: { type: string }
        actor_roles:
          type: array
          items: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        before:
          type: [object, "null"]
          additionalProperties: true
        after:
          type: [object, "null"]
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
