  /webhooks/stripe:
    post:
      tags: [Stripe]
      summary: Stripe webhook receiver (public, HMAC-verified)
      description: |
        Public endpoint — no auth required. Verifies Stripe-Signature header
        via HMAC-SHA256. Idempotent: duplicate events are de-duplicated by event ID.
        Handled events: payment_intent.succeeded, payment_intent.payment_failed, charge.refunded.
      security: []
      operationId: stripeWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Event processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid Stripe signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /webhooks/postmark:
    post:
      tags: [Communications]
      summary: Postmark delivery-state webhook receiver
      description: |
        Public endpoint for Postmark delivery-state events. Supports Delivery,
        Bounce, SpamComplaint, and SubscriptionChange events and updates local
        delivery/suppression state using the message metadata and provider
        message ID.
      security: []
      operationId: postmarkWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Webhook processed or safely ignored
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: processed }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid Postmark webhook authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

