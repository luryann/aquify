      required: [role, title, starts_at, ends_at, capacity]
      description: A job needs meet_id or event_name.
      properties:
        meet_id: { type: string }
        event_name: { type: string }
        season_id: { type: string, description: Explicit season; otherwise derived from the shift date }
        role: { type: string, enum: [timer, concessions, marshal, official, hospitality, setup, admin, other] }
        title: { type: string, maxLength: 120 }
        description: { type: string }
        location: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 500 }
        hour_credit: { type: number, minimum: 0, maximum: 24 }
        min_age: { type: integer, minimum: 0, maximum: 99 }
        requires_certification: { type: boolean }
    VolunteerJob:
      type: object
      properties:
        id: { type: string }
        org_id: { type: string }
        meet_id: { type: string }
        event_name: { type: string }
        season_id: { type: string }
        role: { type: string }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        capacity: { type: integer }
        hour_credit: { type: number }
        min_age: { type: integer }
        requires_certification: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string }
        updated_by: { type: string }
    VolunteerJobView:
      allOf:
        - $ref: "#/components/schemas/VolunteerJob"
        - type: object
          properties:
            meet_name: { type: string }
            effective_season_id: { type: string }
            filled_count: { type: integer }
            open_spots: { type: integer }
            signups:
              type: array
              description: Staff only
              items: { $ref: "#/components/schemas/VolunteerSignupView" }
    VolunteerSignup:
      type: object
      properties:
        id: { type: string }
        org_id: { type: string }
        job_id: { type: string }
        household_id: { type: string }
        volunteer_name: { type: string }
        swimmer_id: { type: string }
        status: { type: string, enum: [confirmed, cancelled, worked, no_show] }
        hours_credited: { type: number }
        notes: { type: string }
        signed_up_by: { type: string }
        cancelled_at: { type: string, format: date-time }
        cancelled_by: { type: string }
        checked_in_at: { type: string, format: date-time }
        checked_in_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    VolunteerSignupView:
      allOf:
        - $ref: "#/components/schemas/VolunteerSignup"
        - type: object
          properties:
            household_name: { type: string }
            effective_hours: { type: number }
