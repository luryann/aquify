  # ── Imports ──────────────────────────────────────────────────────────────────

  /imports/upload-url:
    post:
      tags: [Imports]
      summary: Request presigned upload URL for meet file
      description: Registers an import upload after validating filename safety, declared size cap, and allowed MIME type.
      operationId: requestImportUploadURL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, size_bytes, mime_type]
              properties:
                filename: { type: string }
                file_type:
                  type: string
                  enum: [cl2, sd3, zip, hy3, hyv, ev3]
                meet_id: { type: string, format: uuid }
                size_bytes: { type: integer, format: int64, minimum: 1 }
                mime_type: { type: string }
      responses:
        "201":
          description: Import record and presigned upload URL created
          content:
            application/json:
              schema:
                type: object
                properties:
                  import: { $ref: "#/components/schemas/FileImport" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /imports:
