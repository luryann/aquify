                review_notes: { type: string }
      responses:
        "200":
          description: Request approved and queued
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
