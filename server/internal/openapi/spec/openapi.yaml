      responses:
        "200":
          description: Time standards list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  time_standards:
                    type: array
                    items: { $ref: "#/components/schemas/TimeStandard" }
    post:
      tags: [Performance]
      summary: Create time standard
      operationId: createTimeStandard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTimeStandardRequest" }
      responses:
        "201":
          description: Time standard created
          content:
            application/json:
              schema:
                type: object
                properties:
                  time_standard: { $ref: "#/components/schemas/TimeStandard" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /time-standards/{standardID}:
    get:
      tags: [Performance]
      summary: Get time standard
      operationId: getTimeStandard
      parameters:
        - $ref: "#/components/parameters/StandardID"
      responses:
        "200":
          description: Time standard detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  time_standard: { $ref: "#/components/schemas/TimeStandard" }
        "404":
