          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Volunteer jobs & service hours ──────────────────────────────────────────
  /volunteer/settings:
    get:
      tags: [Volunteer]
      summary: Get org volunteer defaults (admin, coach)
      operationId: getVolunteerSettings
      responses:
        "200":
          description: Settings (defaults when never configured)
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/VolunteerSettings" }
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Volunteer]
      summary: Update org volunteer defaults (admin; audit-logged)
      operationId: updateVolunteerSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                default_required_hours: { type: number, minimum: 0, maximum: 1000 }
                default_buyout_cents_per_hour: { type: integer, minimum: 0, maximum: 100000 }
                cancellation_cutoff_hours: { type: integer, minimum: 0, maximum: 720 }
                reminders_enabled: { type: boolean }
                timezone: { type: string, description: IANA zone used to render reminder emails }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/VolunteerSettings" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /volunteer/templates:
    get:
      tags: [Volunteer]
      summary: List built-in job templates (admin, coach)
      operationId: listVolunteerTemplates
      responses:
        "200":
          description: Templates and the role vocabulary
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates: { type: array, items: { $ref: "#/components/schemas/VolunteerTemplate" } }
                  roles: { type: array, items: { type: string } }
        "403":
          $ref: "#/components/responses/Forbidden"

  /volunteer/jobs:
    get:
      tags: [Volunteer]
      summary: List volunteer jobs with fill state (all roles; roster omitted)
      operationId: listVolunteerJobs
      parameters:
        - { name: meet_id, in: query, schema: { type: string } }
        - { name: season_id, in: query, schema: { type: string }, description: Effective season (explicit or by shift date) }
        - { name: from, in: query, schema: { type: string }, description: RFC3339 or YYYY-MM-DD lower bound on starts_at }
        - { name: to, in: query, schema: { type: string }, description: RFC3339 or YYYY-MM-DD exclusive upper bound on starts_at }
        - { name: upcoming, in: query, schema: { type: boolean }, description: Only jobs that have not ended }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Paginated jobs plus an unpaginated fill summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: { type: array, items: { $ref: "#/components/schemas/VolunteerJobView" } }
                  count: { type: integer }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  summary:
                    type: object
                    properties:
                      job_count: { type: integer }
                      total_capacity: { type: integer }
                      filled_spots: { type: integer }
                      open_spots: { type: integer }
                      fill_rate: { type: number }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Volunteer]
      summary: Create a volunteer job (admin, coach; audit-logged)
      operationId: createVolunteerJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VolunteerJobInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: { $ref: "#/components/schemas/VolunteerJob" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /volunteer/jobs/bulk:
    post:
      tags: [Volunteer]
      summary: Stamp a template's roles onto one or more shifts (admin, coach; atomic, audit-logged)
      operationId: bulkCreateVolunteerJobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [shifts]
              properties:
                meet_id: { type: string }
                event_name: { type: string }
                season_id: { type: string }
                location: { type: string }
                template_id: { type: string, default: standard_meet }
                roles:
                  type: array
                  description: Overrides the template roles when non-empty
                  items: { $ref: "#/components/schemas/VolunteerTemplateRole" }
                shifts:
                  type: array
                  minItems: 1
                  maxItems: 40
                  items:
                    type: object
                    required: [starts_at, ends_at]
                    properties:
                      starts_at: { type: string, format: date-time }
                      ends_at: { type: string, format: date-time }
                      label: { type: string }
      responses:
        "201":
          description: Jobs created
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: { type: array, items: { $ref: "#/components/schemas/VolunteerJob" } }
                  count: { type: integer }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /volunteer/jobs/{jobID}:
    parameters:
      - { name: jobID, in: path, required: true, schema: { type: string } }
    get:
      tags: [Volunteer]
      summary: Get a job (staff also receive the signup roster)
      operationId: getVolunteerJob
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: { $ref: "#/components/schemas/VolunteerJobView" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Volunteer]
      summary: Update a job (admin, coach; audit-logged). Capacity cannot drop below filled spots.
      operationId: updateVolunteerJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                event_name: { type: string }
                season_id: { type: string }
                role: { type: string }
                title: { type: string }
                description: { type: string }
                location: { type: string }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                capacity: { type: integer }
                hour_credit: { type: number }
                min_age: { type: integer }
                requires_certification: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: { $ref: "#/components/schemas/VolunteerJob" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Volunteer]
      summary: Delete a job and its signups (admin, coach; refused once hours are credited)
      operationId: deleteVolunteerJob
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /volunteer/jobs/{jobID}/signups:
    post:
      tags: [Volunteer]
      summary: Take a spot (parent for own household; staff for any household with household_id)
      description: Capacity is enforced atomically (row lock on the job); returns 409 job_full when no spots remain.
      operationId: createVolunteerSignup
      parameters:
        - { name: jobID, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [volunteer_name]
              properties:
                household_id: { type: string, description: Required for staff; must match the session household for parents }
                volunteer_name: { type: string, maxLength: 120 }
                swimmer_id: { type: string, description: Optional teen swimmer volunteer (checked against min_age) }
                certified: { type: boolean, description: Required true for jobs that require certification }
                notes: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Signed up
          content:
            application/json:
              schema:
                type: object
                properties:
                  signup: { $ref: "#/components/schemas/VolunteerSignupView" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /volunteer/signups:
    get:
      tags: [Volunteer]
      summary: List signups with their jobs (parent/swimmer pinned to own household)
      operationId: listVolunteerSignups
      parameters:
        - { name: job_id, in: query, schema: { type: string } }
        - { name: household_id, in: query, schema: { type: string } }
        - { name: meet_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [confirmed, cancelled, worked, no_show] } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Paginated signups
          content:
            application/json:
              schema:
                type: object
                properties:
                  signups: { type: array, items: { $ref: "#/components/schemas/VolunteerSignupView" } }
                  count: { type: integer }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "403":
          $ref: "#/components/responses/Forbidden"

  /volunteer/signups/{signupID}/cancel:
    post:
      tags: [Volunteer]
      summary: Cancel a spot (parent own household before the cutoff; staff any time; audit-logged)
      operationId: cancelVolunteerSignup
      parameters:
        - { name: signupID, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  signup: { $ref: "#/components/schemas/VolunteerSignup" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /volunteer/signups/{signupID}/check-in:
    post:
      tags: [Volunteer]
      summary: Record attendance (admin, coach; audit-logged)
      operationId: checkInVolunteerSignup
      parameters:
        - { name: signupID, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [worked, no_show, confirmed] }
                hours: { type: number, minimum: 0, maximum: 24, description: Overrides the job hour credit when marking worked }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  signup: { $ref: "#/components/schemas/VolunteerSignup" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /volunteer/requirements:
    get:
      tags: [Volunteer]
      summary: List season requirements and household overrides (admin, coach)
      operationId: listVolunteerRequirements
      parameters:
        - { name: season_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Requirements
          content:
            application/json:
              schema:
                type: object
                properties:
                  requirements: { type: array, items: { $ref: "#/components/schemas/VolunteerRequirement" } }
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Volunteer]
      summary: Upsert a season requirement (no household_id) or household override (admin; audit-logged)
      operationId: upsertVolunteerRequirement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [season_id]
              properties:
                season_id: { type: string }
                household_id: { type: string }
                required_hours: { type: number, minimum: 0 }
                buyout_cents_per_hour: { type: integer, minimum: 0 }
                notes: { type: string }
      responses:
        "200":
          description: Stored requirement
          content:
            application/json:
              schema:
                type: object
                properties:
                  requirement: { $ref: "#/components/schemas/VolunteerRequirement" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /volunteer/requirements/{requirementID}:
    delete:
      tags: [Volunteer]
      summary: Delete a requirement (admin; audit-logged)
      operationId: deleteVolunteerRequirement
      parameters:
        - { name: requirementID, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /volunteer/credits:
    get:
      tags: [Volunteer]
      summary: List manual hour credits (parent/swimmer pinned to own household)
      operationId: listVolunteerCredits
      parameters:
        - { name: season_id, in: query, schema: { type: string } }
        - { name: household_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Credits
          content:
            application/json:
              schema:
                type: object
                properties:
                  credits: { type: array, items: { $ref: "#/components/schemas/VolunteerCredit" } }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Volunteer]
      summary: Manually credit (or debit) household hours (admin, coach; audit-logged)
      operationId: createVolunteerCredit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [season_id, household_id, hours, reason]
              properties:
                season_id: { type: string }
                household_id: { type: string }
                hours: { type: number, description: Non-zero, between -200 and 200 }
                reason: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Credit recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  credit: { $ref: "#/components/schemas/VolunteerCredit" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /volunteer/ledger:
    get:
      tags: [Volunteer]
      summary: Season compliance ledger for every active household (admin, coach)
      operationId: getVolunteerSeasonLedger
      parameters:
        - { name: season_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Ledger rows sorted by remaining hours
          content:
            application/json:
              schema:
                type: object
                properties:
                  ledger: { type: array, items: { $ref: "#/components/schemas/VolunteerLedgerRow" } }
                  summary:
                    type: object
                    properties:
                      households: { type: integer }
                      by_status: { type: object, additionalProperties: { type: integer } }
                      buyout_due_cents: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /volunteer/households/{householdID}/ledger:
    get:
      tags: [Volunteer]
      summary: One household's hours per season (parent/swimmer own household; staff any)
      operationId: getVolunteerHouseholdLedger
      parameters:
        - $ref: "#/components/parameters/HouseholdID"
      responses:
        "200":
          description: Ledger rows, newest season first
          content:
            application/json:
              schema:
                type: object
                properties:
                  ledger: { type: array, items: { $ref: "#/components/schemas/VolunteerLedgerRow" } }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /volunteer/buyouts:
    get:
      tags: [Volunteer]
      summary: List billed buyouts (admin)
      operationId: listVolunteerBuyouts
      parameters:
        - { name: season_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Buyouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  buyouts: { type: array, items: { $ref: "#/components/schemas/VolunteerBuyout" } }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Volunteer]
      summary: Bill a household's missing hours as an invoice via the billing service (admin; audit-logged)
      description: |
        Creates a draft invoice with one `manual` line item (remaining hours × buyout rate) through the
        billing service, optionally issuing it. One buyout per household per season; concurrent requests
        are serialised by a reservation row, and a billing failure releases the reservation.
      operationId: billVolunteerBuyout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [season_id, household_id]
              properties:
                season_id: { type: string }
                household_id: { type: string }
                due_date: { type: string, format: date, description: Defaults to 30 days from today }
                issue: { type: boolean, default: false }
      responses:
        "201":
          description: Buyout billed
          content:
            application/json:
              schema:
                type: object
                properties:
                  buyout: { $ref: "#/components/schemas/VolunteerBuyout" }
                  invoice:
                    type: object
                    properties:
                      invoice_id: { type: string }
                      invoice_item_id: { type: string }
                      invoice_number: { type: string }
                      invoice_status: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Training: structured workouts, periodization, analytics ────────────────

  /workouts:
    get:
      tags: [Training]
      summary: List workout library
      description: Lists workouts newest-first. Defaults to templates only; `scope=all` includes practice-owned instances. `q` matches title/description/tags, `tag` filters exactly. Admin or coach.
      operationId: listWorkouts
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [templates, all] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Workout page
          content:
            application/json:
              schema:
                type: object
                required: [workouts, count, total, limit, offset]
                properties:
                  workouts: { type: array, items: { $ref: "#/components/schemas/Workout" } }
                  count: { type: integer }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Training]
      summary: Create workout
      description: Creates a structured workout. `is_template` defaults to true (library). Totals are computed server-side. Admin or coach; audit-logged (`workout.create`).
      operationId: createWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutInput" }
      responses:
        "201":
          description: Workout created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /workouts/parse:
    post:
      tags: [Training]
      summary: Parse quick-entry workout text
      description: |
        Converts shorthand such as `8x100 free @1:30 EN2`, section headers (`Warmup:`), and rounds
        (`3 x {4x100 @1:30, 100 easy} rest 1:00` or `3 rounds:` + indented lines) into structured
        sections plus totals. Unparseable lines are returned in `errors` with their line number. Nothing is stored. Admin or coach.
      operationId: parseWorkoutText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 20000 }
                course: { type: string, enum: [SCY, SCM, LCM] }
      responses:
        "200":
          description: Parsed workout
          content:
            application/json:
              schema:
                type: object
                required: [course, sections, errors, totals]
                properties:
                  course: { type: string }
                  sections: { type: array, items: { $ref: "#/components/schemas/WorkoutSection" } }
                  totals: { $ref: "#/components/schemas/WorkoutTotals" }
                  errors:
                    type: array
                    items:
                      type: object
                      required: [line, text, message]
                      properties:
                        line: { type: integer }
                        text: { type: string }
                        message: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /workouts/preview:
    post:
      tags: [Training]
      summary: Compute workout totals without saving
      description: Validates and normalises sections and returns totals plus a quick-entry text rendering. Admin or coach.
      operationId: previewWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                course: { type: string, enum: [SCY, SCM, LCM] }
                sections: { type: array, items: { $ref: "#/components/schemas/WorkoutSection" } }
      responses:
        "200":
          description: Workout preview
          content:
            application/json:
              schema:
                type: object
                required: [course, sections, totals, text]
                properties:
                  course: { type: string }
                  sections: { type: array, items: { $ref: "#/components/schemas/WorkoutSection" } }
                  totals: { $ref: "#/components/schemas/WorkoutTotals" }
                  text: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /workouts/{workoutID}:
    parameters:
      - $ref: "#/components/parameters/WorkoutID"
    get:
      tags: [Training]
      summary: Get workout
      description: Returns a workout with computed totals and its quick-entry text. Admin or coach.
      operationId: getWorkout
      responses:
        "200":
          description: Workout
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WorkoutResponse"
                  - type: object
                    properties:
                      text: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Training]
      summary: Replace workout content
      description: Replaces title, course, tags and sections. `is_template` is fixed at creation. A practice carrying this workout has its yardage re-derived. Admin or coach; audit-logged (`workout.update`).
      operationId: updateWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutInput" }
      responses:
        "200":
          description: Workout updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Training]
      summary: Delete workout
      description: Deletes a workout. A practice that carried it keeps its last yardage but loses the link. Admin or coach; audit-logged (`workout.delete`).
      operationId: deleteWorkout
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /workouts/{workoutID}/duplicate:
    parameters:
      - $ref: "#/components/parameters/WorkoutID"
    post:
      tags: [Training]
      summary: Duplicate workout / save as template
      description: Copies a workout (default title "<title> (copy)", same template flag). Pass `is_template=true` to save a practice's workout into the library. Admin or coach; audit-logged (`workout.duplicate`).
      operationId: duplicateWorkout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 160 }
                is_template: { type: boolean }
      responses:
        "201":
          description: Copy created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /workouts/{workoutID}/assign:
    parameters:
      - $ref: "#/components/parameters/WorkoutID"
    post:
      tags: [Training]
      summary: Assign workout to a practice
      description: Copies the workout into a practice-owned instance and links it — to `practice_id` (replacing any previous instance) or to a new practice on `date` for `group_id` (type defaults to water). The practice's yardage_target and strokes derive from the workout. Admin or coach; audit-logged (`workout.assign`).
      operationId: assignWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                practice_id: { type: string }
                date: { type: string, format: date }
                group_id: { type: string }
                type: { type: string, enum: [water, dryland, video, rest] }
      responses:
        "201":
          description: Workout assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeWorkoutResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /practices/{practiceID}/workout:
    parameters:
      - $ref: "#/components/parameters/PracticeID"
    get:
      tags: [Training]
      summary: Get a practice's workout
      description: Returns the practice and its structured workout. Parents and swimmers can read practices of their household swimmers' groups (and team-wide practices); others return 404. `no_workout` 404 when the practice has none.
      operationId: getPracticeWorkout
      responses:
        "200":
          description: Practice workout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeWorkoutResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Training]
      summary: Create or replace a practice's workout
      description: Creates or replaces the practice-owned workout instance (never a template). Title defaults to the practice description. Admin or coach; audit-logged (`practice.workout.set`).
      operationId: setPracticeWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutInput" }
      responses:
        "200":
          description: Workout saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeWorkoutResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Training]
      summary: Remove a practice's workout
      description: Unlinks and deletes the practice-owned instance; the practice keeps its last derived yardage. Admin or coach; audit-logged (`practice.workout.clear`).
      operationId: clearPracticeWorkout
      responses:
        "200":
          description: Workout removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  practice: { $ref: "#/components/schemas/TrainingPractice" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /training/schedule:
    get:
      tags: [Training]
      summary: Practice schedule with workouts
      description: Practices dated within [from, to] (default today..+27 days, max 366 days) oldest-first, each with its structured workout or null. Parents and swimmers only see team-wide practices and their household swimmers' groups; coach notes are redacted for them.
      operationId: getTrainingSchedule
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: group_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema:
                type: object
                required: [from, to, items]
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  items:
                    type: array
                    items:
                      type: object
                      required: [practice, workout]
                      properties:
                        practice: { $ref: "#/components/schemas/TrainingPractice" }
                        workout:
                          oneOf:
                            - $ref: "#/components/schemas/Workout"
                            - type: "null"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /training/analytics:
    get:
      tags: [Training]
      summary: Group training analytics
      description: |
        Weekly (ISO, Monday) planned volume, swimmer volume (planned × present), attendance % (present / (present + absent))
        per group, plus zone and stroke distribution from structured workouts, over [from, to] (default last 8 weeks, max 366 days).
        Volumes are yards (metres converted). Admin or coach.
      operationId: getTrainingAnalytics
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: group_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingAnalytics" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /training/analytics/swimmers/{swimmerID}:
    parameters:
      - $ref: "#/components/parameters/SwimmerID"
    get:
      tags: [Training]
      summary: Swimmer training analytics
      description: A swimmer's attended volume per week, attendance counts/percentage and zone distribution. Admin/coach for any swimmer; parents and swimmers for their own household only (others return 404).
      operationId: getSwimmerTrainingAnalytics
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Swimmer analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwimmerTrainingAnalytics" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /seasons/{seasonID}/training-phases:
    parameters:
      - $ref: "#/components/parameters/SeasonID"
    get:
      tags: [Training]
      summary: List a season's training phases
      description: Periodization phases for the season, ordered by group then start date. Admin or coach.
      operationId: listTrainingPhases
      responses:
        "200":
          description: Phases
          content:
            application/json:
              schema:
                type: object
                required: [phases]
                properties:
                  phases: { type: array, items: { $ref: "#/components/schemas/TrainingPhase" } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Training]
      summary: Add a training phase
      description: Adds a base/build/peak/taper/recovery phase for a group. Dates must sit inside the season and must not overlap another phase of the same group (409 `phase_overlap`). Admin or coach; audit-logged (`training_phase.create`).
      operationId: createTrainingPhase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingPhaseInput" }
      responses:
        "201":
          description: Phase created
          content:
            application/json:
              schema:
                type: object
                properties:
                  phase: { $ref: "#/components/schemas/TrainingPhase" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /seasons/{seasonID}/training-plan:
    parameters:
      - $ref: "#/components/parameters/SeasonID"
    get:
      tags: [Training]
      summary: Season plan vs planned yardage
      description: Per group and ISO week, the covering phase's weekly target against the yardage actually planned on practices (structured workouts converted to yards). Admin or coach.
      operationId: getSeasonTrainingPlan
      parameters:
        - { name: group_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Season plan
          content:
            application/json:
              schema:
                type: object
                required: [plan]
                properties:
                  plan:
                    type: object
                    required: [season_id, phases, weeks]
                    properties:
                      season_id: { type: string }
                      start_date: { type: string }
                      end_date: { type: string }
                      phases: { type: array, items: { $ref: "#/components/schemas/TrainingPhase" } }
                      weeks:
                        type: array
                        items:
                          type: object
                          properties:
                            week_start: { type: string, format: date }
                            week_end: { type: string, format: date }
                            group_id: { type: string }
                            phase_id: { type: string }
                            phase: { type: string }
                            target_yards: { type: integer }
                            planned_yards: { type: integer }
                            practices: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /training-phases/{phaseID}:
    parameters:
      - $ref: "#/components/parameters/TrainingPhaseID"
    put:
      tags: [Training]
      summary: Update a training phase
      description: Replaces a phase's fields (same validation as create). Admin or coach; audit-logged (`training_phase.update`).
      operationId: updateTrainingPhase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingPhaseInput" }
      responses:
        "200":
          description: Phase updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  phase: { $ref: "#/components/schemas/TrainingPhase" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Training]
      summary: Delete a training phase
      description: Admin or coach; audit-logged (`training_phase.delete`).
      operationId: deleteTrainingPhase
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

# ─────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────────────────────
  /club-events:
    get:
      tags: [Engagement]
      summary: List club events
      description: Non-meet club events (social, fundraiser, team_meeting, clinic, banquet, dryland, other). Staff see all; parents/swimmers see only events whose audience includes a swimmer in their household (or themselves), with `my_rsvps`, `eligible_swimmers` and `rsvp_open`. Shared `limit`/`offset` pagination.
      operationId: listClubEvents
      parameters:
        - { name: from, in: query, schema: { type: string }, description: YYYY-MM-DD or RFC3339; events ending on/after }
        - { name: to, in: query, schema: { type: string }, description: YYYY-MM-DD (inclusive) or RFC3339 }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/ClubEvent" } }
                  count: { type: integer }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Engagement]
      summary: Create a club event
      description: Admin or coach; audit-logged (`club_event.create`). A fee requires RSVP enabled; group audience requires `group_codes`. All-day events carry UTC-midnight timestamps whose date part is the calendar date.
      operationId: createClubEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClubEventInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { event: { $ref: "#/components/schemas/ClubEvent" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /club-events/{eventID}:
    parameters:
      - { name: eventID, in: path, required: true, schema: { type: string } }
    get:
      tags: [Engagement]
      summary: Get a club event
      description: Families get 404 for events outside their audience.
      operationId: getClubEvent
      responses:
        "200": { description: Event, content: { application/json: { schema: { type: object, properties: { event: { $ref: "#/components/schemas/ClubEvent" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Engagement]
      summary: Replace a club event
      description: Admin or coach; audit-logged (`club_event.update` / `club_event.cancel`). Cancelling voids unpaid RSVP fee invoices. RSVP mode is locked once responses exist (409 `rsvp_mode_locked`).
      operationId: updateClubEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClubEventInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { type: object, properties: { event: { $ref: "#/components/schemas/ClubEvent" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Engagement]
      summary: Delete a club event
      description: Admin or coach; audit-logged. RSVPs are removed and unpaid fee invoices voided.
      operationId: deleteClubEvent
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { type: object, properties: { deleted: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /club-events/{eventID}/rsvps:
    parameters:
      - { name: eventID, in: path, required: true, schema: { type: string } }
    get:
      tags: [Engagement]
      summary: List RSVPs
      description: Staff see the full roster with household/swimmer names; parents see their households' rows; swimmers see their own (plus their household's household-mode row).
      operationId: listClubEventRSVPs
      responses:
        "200":
          description: RSVPs
          content:
            application/json:
              schema:
                type: object
                properties:
                  rsvps: { type: array, items: { $ref: "#/components/schemas/ClubEventRSVP" } }
                  summary: { $ref: "#/components/schemas/ClubEventRSVPSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Engagement]
      summary: Upsert an RSVP
      description: Household-mode events take one RSVP per household (parent only); swimmer-mode events one per eligible swimmer (parent for household swimmers, swimmer for self). Staff may respond on behalf (bypasses deadline, audit-logged). Headcount = 1 + guest_count; capacity counts `yes` headcount (409 `event_full`). A fee creates an issued invoice per RSVP via billing (quantity = headcount); switching away from yes voids it if unpaid. Errors 409 `rsvp_closed`, `rsvp_disabled`, `event_cancelled`.
      operationId: respondClubEventRSVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                household_id: { type: string }
                swimmer_id: { type: string }
                response: { type: string, enum: [yes, no, maybe] }
                guest_count: { type: integer, minimum: 0, maximum: 50 }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  rsvp: { $ref: "#/components/schemas/ClubEventRSVP" }
                  billing: { type: string, enum: [none, charged, unchanged, released, retained_paid, failed] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /club-events/{eventID}/rsvps/export:
    parameters:
      - { name: eventID, in: path, required: true, schema: { type: string } }
    get:
      tags: [Engagement]
      summary: Export the RSVP roster as CSV
      description: Admin or coach; audit-logged (`club_event.rsvp.export`). Formula-leading cells are neutralised.
      operationId: exportClubEventRSVPs
      responses:
        "200": { description: CSV, content: { text/csv: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /calendar/feed-token:
    get:
      tags: [Engagement]
      summary: Calendar feed status
      description: Parent (own household; `household_id` query selects among linked households) or admin (`household_id` required). Never returns the secret.
      operationId: getCalendarFeedToken
      parameters:
        - { name: household_id, in: query, schema: { type: string } }
      responses:
        "200": { description: Status, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarFeedStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Engagement]
      summary: Create or rotate the household calendar feed
      description: Revokes any live token and returns a new secret once (`token`, `feed_path`). Only the SHA-256 hash is stored. Audit-logged (`calendar_feed.rotate`).
      operationId: rotateCalendarFeedToken
      parameters:
        - { name: household_id, in: query, schema: { type: string } }
      responses:
        "201":
          description: New feed
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/CalendarFeedStatus" }
                  - type: object
                    properties:
                      token: { type: string }
                      feed_path: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Engagement]
      summary: Revoke the household calendar feed
      operationId: revokeCalendarFeedToken
      parameters:
        - { name: household_id, in: query, schema: { type: string } }
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarFeedStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /calendar/feed/{token}:
    get:
      tags: [Engagement]
      summary: Household iCalendar feed
      description: Public, read-only; the unguessable token (optionally suffixed `.ics`) is the credential. Contains the household's meets (published+), commitment deadlines, group practices and audience-matching club events from 60 days back to a year ahead. Unknown/revoked tokens return 404.
      operationId: getCalendarFeed
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: iCalendar, content: { text/calendar: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /public/orgs/{slug}/site:
    get:
      tags: [Engagement]
      summary: Public team website feed
      description: Unauthenticated, read-only and rate limited. Returns only club identity and contact, announcements marked public, upcoming published meets, upcoming club events marked public, current team records (swimmer names only) and, when enabled in org settings, coach names. Sites that are disabled or unknown return 404.
      operationId: getPublicTeamSite
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Public site content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTeamSite" }
        "404": { $ref: "#/components/responses/NotFound" }
  /wellness/checkins:
    put:
      tags: [Engagement]
      summary: Submit today's wellness check-in
      description: Swimmer (self) or parent (household swimmer); one per swimmer per day (upsert, 201 on insert, 200 on replace). Scales 1–5 where 5 = more; readiness = mean(sleep_quality, energy, mood, 6−soreness, 6−stress). `date` defaults to today (UTC), may be up to 1 day ahead or 7 days back.
      operationId: upsertWellnessCheckIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sleep_hours, sleep_quality, soreness, energy, stress, mood]
              properties:
                swimmer_id: { type: string }
                date: { type: string, format: date }
                sleep_hours: { type: number, minimum: 0, maximum: 24 }
                sleep_quality: { type: integer, minimum: 1, maximum: 5 }
                soreness: { type: integer, minimum: 1, maximum: 5 }
                energy: { type: integer, minimum: 1, maximum: 5 }
                stress: { type: integer, minimum: 1, maximum: 5 }
                mood: { type: integer, minimum: 1, maximum: 5 }
                note: { type: string, maxLength: 500 }
      responses:
        "200": { description: Replaced, content: { application/json: { schema: { type: object, properties: { checkin: { $ref: "#/components/schemas/WellnessCheckIn" }, created: { type: boolean } } } } } }
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { checkin: { $ref: "#/components/schemas/WellnessCheckIn" }, created: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /wellness/swimmers/{swimmerID}:
    get:
      tags: [Engagement]
      summary: Swimmer wellness trend
      description: Admin/coach or the swimmer's household. Notes are only ever returned to these readers. Returns check-ins, flags, averages and today's check-in.
      operationId: getSwimmerWellness
      parameters:
        - { name: swimmerID, in: path, required: true, schema: { type: string } }
        - { name: days, in: query, schema: { type: integer, maximum: 90, default: 30 } }
      responses:
        "200": { description: Trend, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /wellness/heatmap:
    get:
      tags: [Engagement]
      summary: Group wellness heat-map
      description: Admin or coach. Per-swimmer daily readiness cells for the window, flags (low_readiness_streak, short_sleep_streak, soreness_streak, sharp_drop, check_in_with_athlete), daily team averages. Flagged swimmers sort first.
      operationId: getWellnessHeatmap
      parameters:
        - { name: group, in: query, schema: { type: string }, description: Group code; omit for all swimmers }
        - { name: days, in: query, schema: { type: integer, maximum: 28, default: 14 } }
      responses:
        "200": { description: Heat-map, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /swimmers/{swimmerID}/attendance-summary:
    get:
