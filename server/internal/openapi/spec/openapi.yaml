        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema: { type: object, properties: { count: { type: integer }, invoices: { type: array, items: { $ref: "#/components/schemas/Invoice" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Billing]
      summary: Create invoice (draft)
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvoiceRequest" }
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice: { $ref: "#/components/schemas/Invoice" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /invoices/{invoiceID}:
    get:
