          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice: { $ref: "#/components/schemas/Invoice" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /invoices/{invoiceID}/items:
    get:
      tags: [Billing]
      summary: List invoice line items
      operationId: listInvoiceItems
      parameters:
        - $ref: "#/components/parameters/InvoiceID"
      responses:
        "200":
          description: Line item list
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice_id: { type: string }
                  count: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InvoiceItem" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Billing]
      summary: Add line item to invoice
      operationId: addInvoiceItem
      parameters:
        - $ref: "#/components/parameters/InvoiceID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddInvoiceItemRequest" }
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/InvoiceItem" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /invoices/{invoiceID}/items/{itemID}:
    delete:
      tags: [Billing]
      summary: Remove line item from invoice
      operationId: removeInvoiceItem
      parameters:
        - $ref: "#/components/parameters/InvoiceID"
        - name: itemID
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Item removed
