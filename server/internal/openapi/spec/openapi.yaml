        "404":
          $ref: "#/components/responses/NotFound"

  /imports/{importID}/conflicts/{conflictID}/resolve:
    post:
      tags: [Imports]
      summary: Resolve match conflict (admin only, audited)
      operationId: resolveImportConflict
      parameters:
        - $ref: "#/components/parameters/ImportID"
        - name: conflictID
