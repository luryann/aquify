openapi: 3.1.0
info:
  title: DARE Platform API
  description: |
    Full-stack swim club operations platform covering member/household management,
    meet scheduling and entries, file interoperability (CL2/SD3/ZIP/HY3/HYV/EV3),
    performance tracking, billing (Stripe), communications, and admin reporting.
  version: "1.0.0"
  contact:
    name: DARE Aquatics Engineering

servers:
  - url: /api/v1
    description: Versioned API root

security:
  - BearerAuth: []
    OrgScope: []

tags:
  - name: Health
  - name: Engagement
  - name: Auth
  - name: Users
  - name: Members
  - name: Groups
  - name: Registrations
  - name: Meets
  - name: Commitments
  - name: Entries
  - name: Exports
  - name: Performance
  - name: Billing
  - name: Stripe
  - name: Communications
  - name: Audit
  - name: Compliance
  - name: Jobs
  - name: Training
  - name: Volunteer
  - name: Settings
  - name: Reports
  - name: Seasons
  - name: Documents

# ─────────────────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ── Health ──────────────────────────────────────────────────────────────────

  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Returns 200 when the process is alive.
      security: []
      operationId: healthLive
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Returns 200 when all dependencies (DB, etc.) are reachable.
      security: []
      operationId: healthReady
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /openapi:
    get:
      tags: [Health]
      summary: OpenAPI spec
      description: Serves this OpenAPI 3.1 document.
      security: []
      operationId: getOpenAPI
      responses:
        "200":
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema: { type: string }

  # ── Auth ────────────────────────────────────────────────────────────────────

  /auth/oidc/callback:
    post:
      tags: [Auth]
      summary: OIDC callback — exchange code for session
      description: Exchanges an OIDC authorization code for a platform session. Validates state signature, nonce, and audience, then sets Secure/HttpOnly session cookies plus a Secure CSRF cookie.
      security: []
      operationId: oidcCallback
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OIDCCallbackRequest" }
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OIDCCallbackResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/oidc/authorize:
    get:
      tags: [Auth]
      summary: Begin OIDC login
      description: Generates a signed OIDC `state` payload and redirects the browser to the configured identity provider authorization URL.
      security: []
      operationId: oidcAuthorize
      parameters:
        - in: query
          name: login_hint
          schema: { type: string }
        - in: query
          name: org_id
          schema: { type: string }
      responses:
        "302":
          description: Redirect to identity provider
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/sessions/issue:
    post:
      tags: [Auth]
      summary: Issue session token
      description: Directly issues a session for a known user in approved development/test flows only and sets Secure/HttpOnly session cookies plus a Secure CSRF cookie. This route must not be enabled in non-development environments.
      security: []
      operationId: issueSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueSessionRequest" }
      responses:
        "201":
          description: Session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/sessions/refresh:
    post:
      tags: [Auth]
      summary: Refresh session token
      description: Refreshes a session from either the JSON body or the Secure refresh cookie. Cookie-backed refresh requests must include the CSRF cookie value in the `X-CSRF-Token` header.
      security: []
      operationId: refreshSession
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Session refreshed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/sessions/revoke:
    post:
      tags: [Auth]
      summary: Revoke session
      description: Revokes a session from either the JSON body or the Secure refresh cookie. Cookie-backed revoke requests must include the CSRF cookie value in the `X-CSRF-Token` header.
      security: []
      operationId: revokeSession
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "204":
          description: Session revoked
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/sessions/logout:
    post:
      tags: [Auth]
      summary: Log out browser session
      description: Clears Aquify session cookies, revokes the local refresh token when present, and returns either a Keycloak end-session URL or a fallback app redirect.
      security: []
      operationId: logoutSession
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Logout response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoutResponse" }

  /auth/session:
    get:
      tags: [Auth]
      summary: Current session profile
      description: Returns the current authenticated session identity resolved from the bearer token or the Secure access-token cookie.
      security:
        - BearerAuth: []
      operationId: currentSession
      responses:
        "200":
          description: Current session resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  user:
                    type: object
                    properties:
                      user_id: { type: string }
                      email: { type: string }
                      name: { type: string }
                      org_id: { type: string }
                      household_id: { type: string }
                      roles:
                        type: array
                        items: { type: string }
                      mfa_authenticated: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/mfa/factors:
    get:
      tags: [Auth]
      summary: List enrolled MFA factors
      security:
        - BearerAuth: []
      operationId: listMFAFactors
      responses:
        "200":
          description: Enrolled MFA factors
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  factors:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        user_id: { type: string }
                        org_id: { type: string }
                        factor_type: { type: string }
                        label: { type: string }
                        is_verified: { type: boolean }
                        created_at: { type: string, format: date-time }
                        challenge_hint: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/mfa/enroll:
    post:
      tags: [Auth]
      summary: Enroll MFA factor
      security:
        - BearerAuth: []
          OrgScope: []
      operationId: enrollMFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factor_type]
              properties:
                factor_type:
                  type: string
                  enum: [totp, backup_code]
                label: { type: string }
      responses:
        "201":
          description: MFA factor enrolled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAEnrollResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/mfa/challenge:
    post:
      tags: [Auth]
      summary: Complete MFA challenge
      security:
        - BearerAuth: []
          OrgScope: []
      operationId: challengeMFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factor_id, challenge_code]
              properties:
                factor_id: { type: string }
                challenge_code: { type: string }
      responses:
        "200":
          description: MFA verified — step-up session returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many failed attempts for this factor (5 per 5 minutes); error code `mfa_locked`

  /auth/roles/assign:
    post:
      tags: [Auth]
      summary: Assign role to user (admin + MFA)
      security:
        - BearerAuth: []
          OrgScope: []
      operationId: assignRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignRoleRequest" }
      responses:
        "201":
          description: Role assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignRoleResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /register:
    post:
      tags: [Users]
      summary: Submit public self-registration request
      description: Creates a pending-approval Keycloak user for the provided organization and records the requested role and registration metadata for admin review.
      security: []
      operationId: selfRegister
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfRegisterRequest" }
      responses:
        "201":
          description: Registration request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelfRegisterResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /users:
    get:
      tags: [Users]
      summary: List users in org
      description: Lists users in the caller's org with optional search, role, status, and pagination filters. Admin only.
      operationId: listUsers
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: role
          schema:
            type: string
            enum: [admin, coach, parent, swimmer]
        - in: query
          name: status
          schema:
            type: string
            enum: [active, disabled, pending_approval]
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserListResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [Users]
      summary: Create user with direct password
      description: Creates a Keycloak user, sets a password directly, optionally assigns a role, and can auto-create a linked household. Admin only.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserMutationResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /users/invite:
    post:
      tags: [Users]
      summary: Invite user
      description: Provisions a Keycloak user, optionally assigns a role, optionally creates a linked household, and sends a verification or welcome email. Admin only.
      operationId: inviteUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteUserRequest" }
      responses:
        "201":
          description: User invited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserMutationResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /users/staff:
    get:
      tags: [Users]
      summary: List staff directory
      description: Returns enabled admin and coach accounts in the caller's org with display names and roles only (no email or attributes). Used for coach pickers and resolving `coach_user_id` labels. Admin or coach.
      operationId: listStaff
      responses:
        "200":
          description: Staff directory
          content:
            application/json:
              schema:
                type: object
                required: [status, count, staff]
                properties:
                  status: { type: string, example: ok }
                  count: { type: integer }
                  staff:
                    type: array
                    items:
                      type: object
                      required: [id, name, roles]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        roles:
                          type: array
                          items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user detail
      description: Returns the Keycloak profile plus normalized realm roles for a user in the caller's org. Admin only.
      operationId: getUser
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetailResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags: [Users]
      summary: Update user profile fields
      description: Updates email and display-name fields for an existing user in the caller's org. Admin only.
      operationId: updateUser
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStatusResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [Users]
      summary: Delete user
      description: Deletes a Keycloak user in the caller's org. Admin only and requires MFA-authenticated session state.
      operationId: deleteUser
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStatusResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /users/{id}/disable:
    post:
      tags: [Users]
      summary: Disable user
      description: Disables a Keycloak user in the caller's org. Admin only.
      operationId: disableUser
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: User disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStatusResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /users/{id}/enable:
    post:
      tags: [Users]
      summary: Enable user
      description: Re-enables a Keycloak user in the caller's org. Admin only.
      operationId: enableUser
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: User enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStatusResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /users/{id}/approve:
    post:
      tags: [Users]
      summary: Approve self-registration
      description: Activates a pending self-registration request, assigns the requested role when no roles exist yet, and sends the welcome or verification email. Admin only.
      operationId: approveUser
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Registration approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStatusResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /users/{id}/reject:
    post:
      tags: [Users]
      summary: Reject self-registration
      description: Rejects a pending self-registration request and disables the user account. Admin only.
      operationId: rejectUser
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectUserRequest" }
      responses:
        "200":
          description: Registration rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStatusResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /users/{id}/roles:
    get:
      tags: [Users]
      summary: List user roles
      description: Lists normalized Keycloak realm roles for a user in the caller's org. Admin only.
      operationId: listUserRoles
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: User roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserRolesResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [Users]
      summary: Assign user role
      description: Assigns a realm role at or below the actor's privilege tier. Admin only.
      operationId: assignUserRole
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRoleAssignRequest" }
      responses:
        "200":
          description: Role assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStatusResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /users/{id}/roles/{role}:
    delete:
      tags: [Users]
      summary: Remove user role
      description: Removes a realm role at or below the actor's privilege tier. Prevents removing the final admin role in an org. Admin only.
      operationId: removeUserRole
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/UserRoleName"
      responses:
        "200":
          description: Role removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStatusResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /users/{id}/password-reset:
    post:
      tags: [Users]
      summary: Send password reset email
      description: Triggers the Keycloak password-reset flow for a user in the caller's org. Admin only.
      operationId: passwordResetUser
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Password reset email sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStatusResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /users/{id}/household:
    get:
      tags: [Users]
      summary: Get linked household
      description: Returns the household linked to the user when it belongs to the same org; otherwise returns `null`. Admin only.
      operationId: getUserHousehold
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Linked household summary or null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserHouseholdResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /users/{id}/household/link:
    post:
      tags: [Users]
      summary: Link household to user
      description: Links an existing household in the caller's org to the specified Keycloak user. Admin only.
      operationId: linkUserHousehold
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HouseholdLinkRequest" }
      responses:
        "200":
          description: Household linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserHouseholdLinkResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /users/{id}/household/unlink:
    post:
      tags: [Users]
      summary: Unlink household from user
