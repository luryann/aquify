    post:
      tags: [Compliance]
      summary: Approve data deletion (admin, MFA required)
      description: >-
        Approves a pending (or failed) erasure request and queues the
        compliance:data_deletion job, which erases the household's swimmers,
        contacts, documents, messages, and login accounts and anonymizes the
        household while retaining financial records.
      operationId: approveDataDeletionRequest
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
