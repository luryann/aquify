    post:
      tags: [Compliance]
      summary: Reject data deletion (admin)
      description: Closes a pending erasure request without deleting anything. Review notes are required so the decision is on record.
      operationId: rejectDataDeletionRequest
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
