                  import: { $ref: "#/components/schemas/FileImport" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /imports/{importID}/conflicts:
    get:
      tags: [Imports]
      summary: List match conflicts for import
      operationId: listImportConflicts
      parameters:
        - $ref: "#/components/parameters/ImportID"
      responses:
        "200":
          description: Conflict list
          content:
            application/json:
              schema:
                type: object
                properties:
