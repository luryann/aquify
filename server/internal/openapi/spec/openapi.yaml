      type: object
      properties:
        id: { type: string }
        org_id: { type: string }
        season_id: { type: string }
        household_id: { type: string, description: Empty for the season-wide requirement }
        required_hours: { type: number }
        buyout_cents_per_hour: { type: integer }
        notes: { type: string }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
    VolunteerCredit:
      type: object
      properties:
        id: { type: string }
        org_id: { type: string }
        season_id: { type: string }
        household_id: { type: string }
        hours: { type: number }
        reason: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    VolunteerBuyout:
      type: object
      properties:
        id: { type: string }
        org_id: { type: string }
        season_id: { type: string }
        household_id: { type: string }
        status: { type: string, enum: [pending, billed] }
        hours_short: { type: number }
        rate_cents_per_hour: { type: integer }
        amount_cents: { type: integer }
        invoice_id: { type: string }
        invoice_item_id: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    VolunteerLedgerRow:
      type: object
      properties:
        season_id: { type: string }
        season_name: { type: string }
        season_status: { type: string }
        season_start_date: { type: string, format: date }
        season_end_date: { type: string, format: date }
        household_id: { type: string }
        household_name: { type: string }
        required_hours: { type: number }
        worked_hours: { type: number }
        credited_hours: { type: number }
        earned_hours: { type: number }
        scheduled_hours: { type: number, description: Hours from confirmed signups not yet checked in }
        remaining_hours: { type: number }
        buyout_cents_per_hour: { type: integer }
        buyout_due_cents: { type: integer }
        requirement_source: { type: string, enum: [household, season, org_default] }
