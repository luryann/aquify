      summary: Coach override — reassign swimmer event (requires reason, audited)
      operationId: overrideEntry
      parameters:
        - $ref: "#/components/parameters/MeetID"
        - $ref: "#/components/parameters/EntryID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_meet_event_id, reason]
              properties:
                new_meet_event_id: { type: string, format: uuid }
                seed_time_ms: { type: [integer, "null"] }
                reason: { type: string }
      responses:
        "200":
          description: Entry overridden
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  entry: { $ref: "#/components/schemas/Entry" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /meets/{meetID}/entries/{entryID}/approve:
    post:
      tags: [Entries]
      summary: Approve entry (coach/admin)
      operationId: approveEntry
      parameters:
        - $ref: "#/components/parameters/MeetID"
        - $ref: "#/components/parameters/EntryID"
      responses:
        "200":
          description: Entry approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  entry: { $ref: "#/components/schemas/Entry" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /meets/{meetID}/entries/{entryID}:
    delete:
      tags: [Entries]
      summary: Scratch entry (coach/admin)
      description: >
        Soft-scratches an entry. The record is retained (status becomes
        `scratched`) but excluded from reports and exports. Blocked once the
        meet is finalized/closed or the entry has been exported.
      operationId: scratchEntry
      parameters:
        - $ref: "#/components/parameters/MeetID"
        - $ref: "#/components/parameters/EntryID"
        - name: reason
          in: query
          required: false
          schema: { type: string }
          description: Optional reason recorded on the audit event.
      responses:
        "200":
          description: Entry scratched
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  entry: { $ref: "#/components/schemas/Entry" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

