                time_ms: { type: integer }
                is_active: { type: boolean }
      responses:
        "200":
          description: Time standard updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  time_standard: { $ref: "#/components/schemas/TimeStandard" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Performance]
      summary: Delete time standard
      operationId: deleteTimeStandard
      parameters:
        - $ref: "#/components/parameters/StandardID"
      responses:
        "200":
          description: Time standard deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  id: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Billing ──────────────────────────────────────────────────────────────────

  /invoices:
